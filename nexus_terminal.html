<!DOCTYPE html>

<style>
:root{--bg:#0a0e14;--bg-deep:#060811;--panel:rgba(18,22,31,.72);--border:rgba(255,255,255,.08);--border-hover:rgba(34,211,238,.35);--cyan:#22d3ee;--violet:#7c6ff0;--green:#16c784;--red:#ea3943;--amber:#f59e0b;--text:#e7ebf3;--text-dim:#8b93a7;--text-faint:#545c6e;--font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace}

body{font-family:var(--font-body);color:var(--text);overflow:hidden;background:radial-gradient(ellipse 900px 500px at 15% -5%,rgba(124,111,240,.10),transparent),radial-gradient(ellipse 900px 600px at 85% 105%,rgba(34,211,238,.08),transparent),var(--bg-deep)}

.interval-group{display:flex;gap:4px;background:rgba(255,255,255,.03);padding:3px;border-radius:9px;border:1px solid var(--border)}.interval-btn{background:transparent;border:none;color:var(--text-dim);font-size:12px;font-weight:600;padding:6px 12px;border-radius:6px}.interval-btn:hover{color:var(--text)}.interval-btn.active{background:rgba(34,211,238,.12);color:var(--cyan)}

.analysis-panel{padding:16px;display:flex;flex-direction:column;gap:14px}
.analysis-header{display:flex;align-items:flex-start;justify-content:space-between}.analysis-title{font-family:var(--font-display);font-weight:700;font-size:18px}.analysis-title .dim{color:var(--text-faint);font-weight:500;font-size:13px}.analysis-subtitle{color:var(--text-faint);font-size:12px;margin-top:2px}
.speaker-btn{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:linear-gradient(145deg,rgba(34,211,238,.08),rgba(124,111,240,.06));color:var(--cyan);display:flex;align-items:center;justify-content:center;transition:all .15s ease;flex-shrink:0}.speaker-btn:hover{border-color:var(--border-hover);transform:translateY(-1px)}.speaker-btn.active{background:linear-gradient(145deg,rgba(34,211,238,.22),rgba(124,111,240,.15));border-color:rgba(34,211,238,.5);color:#fff}
.speaker-ring{position:absolute;inset:-3px;border-radius:14px;border:1px solid var(--cyan);animation:pulse-ring 1.6s infinite;pointer-events:none}
.speaking-indicator{display:flex;align-items:center;gap:3px;padding:8px 10px;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.2);border-radius:9px;font-size:11px;color:var(--cyan)}.speaking-indicator .bar{width:3px;height:12px;background:var(--cyan);border-radius:2px;animation:bar-bounce .9s ease-in-out infinite}.speaking-indicator .bar:nth-child(2){animation-delay:.15s}.speaking-indicator .bar:nth-child(3){animation-delay:.3s}.speaking-indicator .bar:nth-child(4){animation-delay:.45s}.speaking-indicator .mono{margin-left:6px}
.analysis-tabs{display:flex;gap:4px;background:rgba(255,255,255,.03);padding:3px;border-radius:9px;border:1px solid var(--border)}.analysis-tabs button{flex:1;background:transparent;border:none;color:var(--text-dim);font-size:11.5px;font-weight:600;padding:7px 0;border-radius:6px}.analysis-tabs button.active{background:rgba(124,111,240,.14);color:var(--violet)}
.analysis-body{display:flex;flex-direction:column;gap:10px;animation:fadeUp .25s ease}.analysis-loading{color:var(--text-faint);font-size:12px;padding:20px 0;text-align:center}
.stat-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}.stat-label{color:var(--text-faint)}.stat-value{font-weight:600}.stat-value.up{color:var(--green)}.stat-value.down{color:var(--red)}
.trend-badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;display:inline-block}.trend-badge.uptrend{background:rgba(22,199,132,.12);color:var(--green)}.trend-badge.downtrend{background:rgba(234,57,67,.12);color:var(--red)}.trend-badge.sideways{background:rgba(255,255,255,.06);color:var(--text-dim)}
.section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin-top:8px;margin-bottom:6px;font-weight:600}
.momentum-meter{margin-top:4px}.momentum-track{position:relative;height:8px;border-radius:5px;overflow:hidden;display:flex}.momentum-zone.oversold{width:30%;background:rgba(22,199,132,.35)}.momentum-zone.neutral{width:40%;background:rgba(255,255,255,.06)}.momentum-zone.overbought{width:30%;background:rgba(234,57,67,.35)}.momentum-needle{position:absolute;top:-3px;width:3px;height:14px;background:#fff;border-radius:2px;box-shadow:0 0 6px rgba(255,255,255,.6);transform:translateX(-50%);transition:left .4s ease}.momentum-labels{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text-faint);margin-top:4px}.momentum-readout{font-size:12px;text-align:right;margin-top:-4px}.momentum-readout .up{color:var(--green)}.momentum-readout .down{color:var(--red)}
.levels-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.levels-heading{font-size:11px;font-weight:700;margin-bottom:6px}.levels-heading.resist{color:var(--red)}.levels-heading.support{color:var(--green)}.level-item{font-size:12px;color:var(--text-dim);padding:3px 0}
.indicator-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.indicator-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:8px;padding:10px}.indicator-name{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}.indicator-val{font-size:14px;font-weight:700;margin-top:4px}.indicator-val.up{color:var(--green)}.indicator-val.down{color:var(--red)}.indicator-val.neutral{color:var(--text-dim)}.indicator-desc{font-size:10px;color:var(--text-faint);margin-top:2px}
.signal-card{background:linear-gradient(135deg,rgba(34,211,238,.06),rgba(124,111,240,.04));border:1px solid rgba(34,211,238,.15);border-radius:12px;padding:14px}.signal-action{font-size:24px;font-weight:700;font-family:var(--font-display)}.signal-action.buy{color:var(--green)}.signal-action.sell{color:var(--red)}.signal-action.wait{color:var(--amber)}.signal-confidence{font-size:11px;color:var(--text-faint);margin-top:4px}.signal-detail{font-size:12px;color:var(--text-dim);margin-top:8px;line-height:1.5}
.fundamental-note{font-size:12.5px;line-height:1.6;color:var(--text-dim);background:rgba(124,111,240,.06);border:1px solid rgba(124,111,240,.18);padding:12px;border-radius:10px}.fundamental-links a{display:inline-block;margin-top:10px;color:var(--cyan);font-size:12.5px;text-decoration:none;border-bottom:1px solid rgba(34,211,238,.3)}
.news-list{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto}.news-item{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:var(--text-dim);line-height:1.5;padding:8px;border-radius:8px;background:rgba(255,255,255,.02);cursor:pointer;text-decoration:none}.news-item:hover{background:rgba(255,255,255,.05)}.news-dot{width:5px;height:5px;border-radius:50%;margin-top:6px;flex-shrink:0}.news-dot.positive{background:var(--green)}.news-dot.negative{background:var(--red)}.news-dot.neutral{background:var(--violet)}.news-body{flex:1;min-width:0}.news-title{font-weight:600;color:var(--text);font-size:12px;margin-bottom:2px}.news-source{font-size:10px;color:var(--text-faint)}.news-img{width:60px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0}
.video-list{display:flex;flex-direction:column;gap:10px;max-height:500px;overflow-y:auto}.video-item{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .15s ease}.video-item:hover{border-color:var(--border-hover)}.video-thumb{width:100%;height:120px;object-fit:cover;background:rgba(255,255,255,.04)}.video-info{padding:8px 10px}.video-title{font-size:12px;font-weight:600;color:var(--text);line-height:1.4}.video-channel{font-size:10px;color:var(--text-faint);margin-top:3px}.video-embed{width:100%;aspect-ratio:16/9;border:none;border-radius:10px}
.trending-list{display:flex;flex-wrap:wrap;gap:6px}.trending-chip{font-size:11px;padding:4px 9px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:20px;color:var(--text-dim)}.dim{color:var(--text-faint)}
@media(max-width:980px){.left-sidebar{position:absolute;z-index:15;height:calc(100% - 56px);box-shadow:20px 0 40px rgba(0,0,0,.4)}.right-sidebar{width:300px}}
</style>

<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo,useCallback}=React;
const BINANCE_REST='https://api.binance.com/api/v3';const CG_BASE='https://api.coingecko.com/api/v3';const YF_BASE='https://query1.finance.yahoo.com/v8/finance/chart';const NEWS_API='https://min-api.cryptocompare.com/data/v2/news';
const CRYPTO_SYMBOLS=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','ADAUSDT','DOGEUSDT','AVAXUSDT','DOTUSDT','LINKUSDT','MATICUSDT','LTCUSDT','TRXUSDT','SHIBUSDT','ATOMUSDT','UNIUSDT','ETCUSDT','XLMUSDT','NEARUSDT','APTUSDT'];
const INDIAN_INDICES=[{symbol:'^NSEI',label:'NIFTY 50',name:'Nifty 50'},{symbol:'^BSESN',label:'SENSEX',name:'BSE Sensex'},{symbol:'^NSEBANK',label:'NIFTY BANK',name:'Nifty Bank'},{symbol:'^CNXIT',label:'NIFTY IT',name:'Nifty IT'},{symbol:'RELIANCE.NS',label:'RELIANCE',name:'Reliance Industries'},{symbol:'TCS.NS',label:'TCS',name:'Tata Consultancy'},{symbol:'INFY.NS',label:'INFY',name:'Infosys'},{symbol:'HDFCBANK.NS',label:'HDFCBANK',name:'HDFC Bank'}];
const COIN_META={BTC:{name:'Bitcoin'},ETH:{name:'Ethereum'},BNB:{name:'BNB'},SOL:{name:'Solana'},XRP:{name:'XRP'},ADA:{name:'Cardano'},DOGE:{name:'Dogecoin'},AVAX:{name:'Avalanche'},DOT:{name:'Polkadot'},LINK:{name:'Chainlink'},MATIC:{name:'Polygon'},LTC:{name:'Litecoin'},TRX:{name:'TRON'},SHIB:{name:'Shiba Inu'},ATOM:{name:'Cosmos'},UNI:{name:'Uniswap'},ETC:{name:'Ethereum Classic'},XLM:{name:'Stellar'},NEAR:{name:'NEAR Protocol'},APT:{name:'Aptos'}};
const SYMBOL_TO_ID={BTC:'bitcoin',ETH:'ethereum',BNB:'binancecoin',SOL:'solana',XRP:'ripple',ADA:'cardano',DOGE:'dogecoin',AVAX:'avalanche-2',DOT:'polkadot',LINK:'chainlink',MATIC:'matic-network',LTC:'litecoin',TRX:'tron',SHIB:'shiba-inu',ATOM:'cosmos',UNI:'uniswap',ETC:'ethereum-classic',XLM:'stellar',NEAR:'near',APT:'aptos'};
function baseAsset(s){return s.replace(/USDT$/,'')}function coinName(s){return COIN_META[baseAsset(s)]?.name||baseAsset(s)}
function logoUrl(s){return`https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/32/color/${baseAsset(s).toLowerCase()}.png`}
function fmt(n,dec=2){if(n==null||isNaN(n))return'—';if(Math.abs(n)>=1e12)return(n/1e12).toFixed(2)+'T';if(Math.abs(n)>=1e9)return(n/1e9).toFixed(2)+'B';if(Math.abs(n)>=1e6)return(n/1e6).toFixed(2)+'M';return n.toFixed(dec)}
function fmtPrice(n){if(n==null||isNaN(n))return'—';if(n>=1000)return n.toLocaleString('en-US',{maximumFractionDigits:0});if(n>=1)return n.toFixed(2);return n.toFixed(6)}
function stripHtml(s){return s?s.replace(/<[^>]*>/g,''):' '}function timeAgo(t){const d=Math.floor((Date.now()-t*1000)/60000);if(d<60)return d+'m ago';if(d<1440)return Math.floor(d/60)+'h ago';return Math.floor(d/1440)+'d ago'}
async function fetchBinanceKlines(sym,interval='1h',limit=300){try{const r=await fetch(`${BINANCE_REST}/klines?symbol=${sym}&interval=${interval}&limit=${limit}`);const raw=await r.json();return raw.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}))}catch(e){return[]}}
async function fetchBinanceTickers(){try{const r=await fetch(`${BINANCE_REST}/ticker/24hr`);const all=await r.json();const s=new Set(CRYPTO_SYMBOLS);return all.filter(t=>s.has(t.symbol))}catch(e){return[]}}
function subscribeBinanceKline(sym,interval,cb){const ws=new WebSocket(`wss://stream.binance.com:9443/ws/${sym.toLowerCase()}@kline_${interval}`);ws.onmessage=e=>{const k=JSON.parse(e.data).k;cb({time:Math.floor(k.t/1000),open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v,isFinal:k.x})};return()=>ws.close()}
function subscribeBinanceTickers(cb){const ws=new WebSocket('wss://stream.binance.com:9443/ws/!miniTicker@arr');ws.onmessage=e=>cb(JSON.parse(e.data));return()=>ws.close()}
const YF_INT={'15m':'15m','1h':'60m','4h':'60m','1d':'1d','1w':'1wk'};const YF_RNG={'15m':'5d','1h':'1mo','4h':'3mo','1d':'1y','1w':'5y'};
async function fetchYFQuote(sym){try{const r=await fetch(`${YF_BASE}/${sym}?interval=1d&range=1d`);const d=await r.json();const m=d.chart?.result?.[0]?.meta;return m?{price:m.regularMarketPrice,changePct:((m.regularMarketPrice-m.previousClose)/m.previousClose*100)}:null}catch(e){return null}}
async function fetchYFKlines(sym,interval='1h'){try{const r=await fetch(`${YF_BASE}/${sym}?interval=${YF_INT[interval]||'60m'}&range=${YF_RNG[interval]||'1mo'}`);const d=await r.json();const res=d.chart?.result?.[0];if(!res)return[];const ts=res.timestamp||[];const q=res.indicators?.quote?.[0]||{};return ts.map((t,i)=>({time:t,open:q.open?.[i]||0,high:q.high?.[i]||0,low:q.low?.[i]||0,close:q.close?.[i]||0,volume:q.volume?.[i]||0})).filter(c=>c.close>0)}catch(e){return[]}}
async function fetchYFFundamentals(sym){try{const r=await fetch(`https://query1.finance.yahoo.com/v10/finance/quoteSummary/${sym}?modules=summaryDetail,price,financialData,assetProfile`);const d=await r.json();const res=d.quoteSummary?.result?.[0];if(!res)return null;const sd=res.summaryDetail||{},p=res.price||{},fd=res.financialData||{},ap=res.assetProfile||{};const v=x=>x?.raw||null;return{name:p.shortName||sym,sector:ap.sector||'—',industry:ap.industry||'—',desc:(ap.longBusinessSummary||'').slice(0,400),marketCap:v(sd.marketCap),pe:v(sd.trailingPE),eps:v(sd.trailingPE),pb:v(sd.priceToBook),beta:v(sd.beta),profitMargin:v(fd.profitMargins),high52:v(sd.fiftyTwoWeekHigh),low52:v(sd.fiftyTwoWeekLow),target:v(fd.targetMeanPrice),recommendation:fd.recommendationKey||'—',website:ap.website}}catch(e){return null}}
async function fetchYFNews(sym){try{const q=sym.replace(/\^/,'').replace('.NS','');const r=await fetch(`https://query1.finance.yahoo.com/v1/finance/search?q=${q}&newsCount=10&quotesCount=0`);const d=await r.json();return(d.news||[]).map(n=>({title:n.title,source:n.publisher,url:n.link,published:n.providerPublishTime,img:n.thumbnail?.resolutions?.[0]?.url,category:'neutral'}))}catch(e){return[]}}
const cgCache=new Map();async function cgFetch(url,ttl=60000){const h=cgCache.get(url);if(h&&Date.now()-h.time<ttl)return h.data;const r=await fetch(url);const d=await r.json();cgCache.set(url,{d,time:Date.now()});return d}

async function fetchYouTubeVideos(query){try{const r=await fetch(`https://www.youtube.com/feeds/videos.xml?search_query=${encodeURIComponent(query+' trading analysis')}`);const text=await r.text();const parser=new DOMParser();const xml=parser.parseFromString(text,'text/xml');const entries=xml.querySelectorAll('entry');const vids=[];entries.forEach((e,i)=>{if(i>=8)return;vids.push({vid:e.querySelector('videoId')?.textContent||'',title:e.querySelector('title')?.textContent||'',author:e.querySelector('author name')?.textContent||'',thumb:e.querySelector('thumbnail')?.getAttribute('url')||'',published:new Date(e.querySelector('published')?.textContent||0).getTime()/1000})});return vids}catch(e){return[]}}
function calcRSI(closes,period=14){if(closes.length<period+1)return null;let g=0,l=0;for(let i=closes.length-period;i<closes.length;i++){const ch=closes[i]-closes[i-1];if(ch>0)g+=ch;else l-=ch}const rs=(g/period)/(l/period||1);return 100-100/(1+rs)}
function calcEMA(data,period){if(data.length<period)return null;const k=2/(period+1);let e=data[0].close;for(let i=1;i<data.length;i++)e=data[i].close*k+e*(1-k);return e}
function calcMACD(closes){if(closes.length<35)return null;let e12=closes[0],e26=closes[0];for(let i=1;i<closes.length;i++){e12=closes[i]*2/13+e12*11/13;e26=closes[i]*2/27+e26*25/27}return e12-e26}
function calcBB(closes,period=20,sd=2){if(closes.length<period)return null;const sl=closes.slice(-period);const sma=sl.reduce((a,b)=>a+b,0)/period;const v=sl.reduce((a,b)=>a+(b-sma)**2,0)/period;const s=Math.sqrt(v);return{upper:sma+sd*s,middle:sma,lower:sma-sd*s,width:s/sma*100}}
function calcATR(data,period=14){if(data.length<period+1)return null;let sum=0;for(let i=data.length-period;i<data.length;i++){const tr=Math.max(data[i].high-data[i].low,Math.abs(data[i].high-data[i-1].close),Math.abs(data[i].low-data[i-1].close));sum+=tr}return sum/period}
function calcVWAP(data){let pv=0,vol=0;data.forEach(d=>{pv+=d.close*d.volume;vol+=d.volume});return vol>0?pv/vol:null}
function calcFib(data){const r=data.slice(-100);if(r.length<10)return null;const h=Math.max(...r.map(d=>d.high)),l=Math.min(...r.map(d=>d.low)),d=h-l;return{l0:h,l236:h-d*.236,l382:h-d*.382,l500:h-d*.5,l618:h-d*.618,l786:h-d*.786,l100:l}}
function calcSR(data){const r=data.slice(-200);if(r.length<20)return{res:[],sup:[]};return{res:r.map(d=>d.high).sort((a,b)=>b-a).slice(0,5),sup:r.map(d=>d.low).sort((a,b)=>a-b).slice(0,5)}}
function analyzeTrend(data){if(data.length<50)return{trend:'sideways',detail:'Insufficient data'};const closes=data.map(d=>d.close);const e20=calcEMA(data.slice(-30),20),e50=calcEMA(data.slice(-60),50),e200=calcEMA(data.slice(-210),200);const price=closes[closes.length-1];let b=0,r=0;if(e20&&price>e20)b++;else r++;if(e50&&e20>e50)b++;else r++;if(e200&&price>e200)b++;else r++;if(b>=2)return{trend:'uptrend',detail:'Bullish structure'};if(r>=2)return{trend:'downtrend',detail:'Bearish structure'};return{trend:'sideways',detail:'Range-bound'}}
function generateSignal(data){if(data.length<50)return{action:'WAIT',confidence:0,detail:'Not enough data'};const closes=data.map(d=>d.close);const rsi=calcRSI(closes),macd=calcMACD(closes),bb=calcBB(closes),trend=analyzeTrend(data);const price=closes[closes.length-1];let sc=0,rs=[];if(rsi<30){sc+=2;rs.push('RSI oversold')}else if(rsi>70){sc-=2;rs.push('RSI overbought')}else if(rsi>50){sc++;rs.push('RSI bullish')}else{sc--;rs.push('RSI bearish')}if(macd>0){sc++;rs.push('MACD positive')}else{sc--;rs.push('MACD negative')}if(bb&&price<bb.lower){sc++;rs.push('Below BB lower')}else if(bb&&price>bb.upper){sc--;rs.push('Above BB upper')}if(trend.trend==='uptrend'){sc++;rs.push('Uptrend')}else if(trend.trend==='downtrend'){sc--;rs.push('Downtrend')}let act='WAIT',conf=50;if(sc>=3){act='BUY';conf=Math.min(95,60+sc*5)}else if(sc<=-3){act='SELL';conf=Math.min(95,60+Math.abs(sc)*5)}else if(sc>0){act='BUY';conf=55+sc*5}else if(sc<0){act='SELL';conf=55+Math.abs(sc)*5}return{action:act,confidence:conf,detail:rs.join(' • '),rsi,macd,bb,trend}}

function TechnicalTab({data}){if(!data||data.length<20)return<div className="analysis-loading">Loading technical analysis…</div>;const closes=data.map(d=>d.close);const rsi=calcRSI(closes),macd=calcMACD(closes),bb=calcBB(closes),ema20=calcEMA(data.slice(-30),20),ema50=calcEMA(data.slice(-60),50),ema200=calcEMA(data.slice(-210),200),atr=calcATR(data),vwap=calcVWAP(data.slice(-50)),fib=calcFib(data),sr=calcSR(data),trend=analyzeTrend(data),signal=generateSignal(data);const price=closes[closes.length-1];return(<div className="analysis-body"><SignalCard signal={signal}/><div className="section-label">Trend Structure</div><div className="stat-row"><span className="stat-label">Direction</span><span className={`trend-badge ${trend.trend}`}>{trend.trend.toUpperCase()}</span></div><div style={{fontSize:11.5,color:'var(--text-dim)'}}>{trend.detail}</div><div className="section-label">RSI (14)</div><MomentumMeter rsi={rsi}/><div className="section-label">Key Indicators</div><div className="indicator-grid"><div className="indicator-card"><div className="indicator-name">RSI (14)</div><div className={`indicator-val ${rsi<30?'up':rsi>70?'down':'neutral'}`}>{rsi?.toFixed(1)||'—'}</div><div className="indicator-desc">{rsi<30?'Oversold':rsi>70?'Overbought':'Neutral'}</div></div><div className="indicator-card"><div className="indicator-name">MACD</div><div className={`indicator-val ${macd>0?'up':'down'}`}>{macd?.toFixed(4)||'—'}</div><div className="indicator-desc">{macd>0?'Bullish':'Bearish'}</div></div><div className="indicator-card"><div className="indicator-name">EMA 20</div><div className={`indicator-val ${price>ema20?'up':'down'}`}>{ema20?.toFixed(2)||'—'}</div><div className="indicator-desc">Short-term</div></div><div className="indicator-card"><div className="indicator-name">EMA 50</div><div className={`indicator-val ${price>ema50?'up':'down'}`}>{ema50?.toFixed(2)||'—'}</div><div className="indicator-desc">Medium-term</div></div><div className="indicator-card"><div className="indicator-name">EMA 200</div><div className={`indicator-val ${price>ema200?'up':'down'}`}>{ema200?.toFixed(2)||'—'}</div><div className="indicator-desc">Long-term</div></div><div className="indicator-card"><div className="indicator-name">ATR (14)</div><div className="indicator-val neutral">{atr?.toFixed(2)||'—'}</div><div className="indicator-desc">Volatility</div></div><div className="indicator-card"><div className="indicator-name">VWAP</div><div className={`indicator-val ${price>vwap?'up':'down'}`}>{vwap?.toFixed(2)||'—'}</div><div className="indicator-desc">Vol-weighted avg</div></div><div className="indicator-card"><div className="indicator-name">BB Width</div><div className="indicator-val neutral">{bb?.width?.toFixed(2)||'—'}%</div><div className="indicator-desc">Bandwidth</div></div></div><div className="section-label">Bollinger Bands</div><div className="stat-row"><span className="stat-label">Upper</span><span className="stat-value down">{bb?.upper?.toFixed(2)||'—'}</span></div><div className="stat-row"><span className="stat-label">Middle</span><span className="stat-value">{bb?.middle?.toFixed(2)||'—'}</span></div><div className="stat-row"><span className="stat-label">Lower</span><span className="stat-value up">{bb?.lower?.toFixed(2)||'—'}</span></div><div className="section-label">Support / Resistance</div><SRLevels sr={sr}/>{fib&&<><div className="section-label">Fibonacci Retracement</div><div className="stat-row"><span className="stat-label">0.0%</span><span className="stat-value">{fmtPrice(fib.l0)}</span></div><div className="stat-row"><span className="stat-label">38.2%</span><span className="stat-value">{fmtPrice(fib.l382)}</span></div><div className="stat-row"><span className="stat-label">50.0%</span><span className="stat-value">{fmtPrice(fib.l500)}</span></div><div className="stat-row"><span className="stat-label">61.8%</span><span className="stat-value">{fmtPrice(fib.l618)}</span></div><div className="stat-row"><span className="stat-label">100%</span> function FundamentalTab({symbol,assetType}){const[data,setData]=useState(null);const[loading,setLoading]=useState(true);useEffect(()=>{setLoading(true);if(assetType==='crypto')fetchCoinFundamentals(baseAsset(symbol)).then(d=>{setData(d);setLoading(false)}).catch(()=>setLoading(false));else fetchYFFundamentals(symbol).then(d=>{setData(d);setLoading(false)}).catch(()=>setLoading(false))},[symbol,assetType]);if(loading)return<div className="analysis-loading">Loading fundamentals…</div>;if(!data)return<div className="analysis-loading">No data available</div>;if(assetType==='crypto')return(<div className="analysis-body"><div className="stat-row"><span className="stat-label">Market Cap Rank</span><span className="stat-value">#{data.rank||'—'}</span></div><div className="stat-row"><span className="stat-label">Market Cap</span><span className="stat-value">${fmt(data.marketCap,0)}</span></div><div className="stat-row"><span className="stat-label">FDV</span><span className="stat-value">${fmt(data.fdv,0)}</span></div><div className="stat-row"><span className="stat-label">Circulating Supply</span><span className="stat-value mono">{fmt(data.circulating,0)} {data.symbol}</span></div><div className="stat-row"><span className="stat-label">Max Supply</span><span className="stat-value mono">{fmt(data.maxSupply,0)||'∞'}</span></div><div className="stat-row"><span className="stat-label">All-Time High</span><span className="stat-value">${fmtPrice(data.ath)}</span></div><div className="section-label">Project Overview</div><div className="fundamental-note">{data.desc}</div>{data.website&&<div className="fundamental-links"><a href={data.website} target="_blank">Visit website →</a></div>}</div>);return(<div className="analysis-body"><div className="stat-row"><span className="stat-label">Sector</span><span className="stat-value">{data.sector}</span></div><div className="stat-row"><span className="stat-label">Industry</span><span className="stat-value">{data.industry}</span></div>{data.pe&&<div className="stat-row"><span className="stat-label">P/E Ratio</span><span className="stat-value">{data.pe.toFixed(2)}</span></div>}{data.pb&&<div className="stat-row"><span className="stat-label">P/B Ratio</span><span className="stat-value">{data.pb.toFixed(2)}</span></div>}{data.beta&&<div className="stat-row"><span className="stat-label">Beta</span><span className="stat-value">{data.beta.toFixed(2)}</span></div>}{data.profitMargin!=null&&<div className="stat-row"><span className="stat-label">Profit Margin</span><span className={`stat-value ${data.profitMargin>0?'up':'down'}`}>{(data.profitMargin*100).toFixed(1)}%</span></div>}{data.high52&&<div className="stat-row"><span className="stat-label">52W High</span><span className="stat-value">₹{fmtPrice(data.high52)}</span></div>}{data.low52&&<div className="stat-row"><span className="stat-label">52W Low</span><span className="stat-value">₹{fmtPrice(data.low52)}</span></div>}{data.target&&<div className="stat-row"><span className="stat-label">Target Price</span><span className="stat-value">₹{fmtPrice(data.target)}</span></div>}{data.recommendation&&data.recommendation!=='—'&&<div className="stat-row"><span className="stat-label">Analyst Rating</span><span className="stat-value">{data.recommendation}</span></div>}<div className="section-label">Company Overview</div><div className="fundamental-note">{data.desc}</div>{data.website&&<div className="fundamental-links"><a href={data.website} target="_blank">Visit website →</a></div>}</div>)}

function AnalysisPanel({symbol,assetType,data}){const[tab,setTab]=useState('technical');const[speaking,setSpeaking]=useState(false);const speak=()=>{if(!data||data.length<20)return;const s=generateSignal(data),t=analyzeTrend(data),closes=data.map(d=>d.close),rsi=calcRSI(closes),price=closes[closes.length-1];const txt=`Analysis for ${baseAsset(symbol)}. Price ${fmtPrice(price)}. Signal: ${s.action}, confidence ${s.confidence} percent. ${s.detail}. Trend: ${t.trend}. RSI: ${rsi?.toFixed(0)}.`;if('speechSynthesis'in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.rate=1.1;u.onend=()=>setSpeaking(false);u.onerror=()=>setSpeaking(false);setSpeaking(true);window.speechSynthesis.speak(u)}};const stopSpeak=()=>{window.speechSynthesis?.cancel();setSpeaking(false)};useEffect(()=>()=>window.speechSynthesis?.cancel(),[]);return(<div className="analysis-panel"><div className="analysis-header"><div><div className="analysis-title">AI Analysis <span className="dim">· {assetType==='crypto'?baseAsset(symbol):symbol.replace(/\^|\.\w+$/g,'')}</span></div><div className="analysis-subtitle">Institutional-grade intelligence</div></div><button className={`speaker-btn ${speaking?'active':''}`} onClick={speaking?stopSpeak:speak}>{speaking&&<div className="speaker-ring"></div>}{speaking?'⏸':'🔊'}</button></div>{speaking&&<div className="speaking-indicator"><div className="bar"></div><div className="bar"></div><div className="bar"></div><div className="bar"></div><span className="mono">AI Narrating…</span></div>}<div className="analysis-tabs"><button className={tab==='technical'?'active':''} onClick={()=>setTab('technical')}>Technical</button><button className={tab==='fundamental'?'active':''} onClick={()=>setTab('fundamental')}>Fundamental</button><button className={tab==='news'?'active':''} onClick={()=>setTab('news')}>News</button><button className={tab==='video'?'active':''} onClick={()=>setTab('video')}>Video</button></div>{tab==='technical'&&<TechnicalTab data={data}/>}{tab==='fundamental'&&<FundamentalTab symbol={symbol} assetType={assetType}/>}{tab==='news'&&<NewsTab symbol={symbol} assetType={assetType}/>}{tab==='video'&&<VideoTab symbol={symbol} assetType={assetType}/>}</div>)}

const displayList=useMemo(()=>{if(assetType==='crypto')return CRYPTO_SYMBOLS.map(s=>({symbol:s,label:baseAsset(s),name:coinName(s),price:tickers[s]?.price||parseFloat(tickers[s]?.c)||null,changePct:tickers[s]?.changePct||parseFloat(tickers[s]?.P)||null}));return INDIAN_INDICES.map(i=>({symbol:i.symbol,label:i.label,name:i.name,price:indianQuotes[i.symbol]?.price||null,changePct:indianQuotes[i.symbol]?.changePct||null}))},[assetType,tickers,indianQuotes]);
const filteredList=useMemo(()=>{if(!search)return displayList;const q=search.toLowerCase();return displayList.filter(c=>c.label?.toLowerCase().includes(q)||c.name?.toLowerCase().includes(q))},[displayList,search]);
useEffect(()=>{setLoading(true);setKlines([]);wsCleanups.current.forEach(c=>c());wsCleanups.current=[];if(currentAssetType==='crypto'){fetchBinanceKlines(selectedSym,interval).then(d=>{setKlines(d);setLoading(false);if(d.length>0){const l=d[d.length-1];setHeaderPrice(l.close);setHeaderChange(((l.close-l.open)/l.open)*100)}});const unsub=subscribeBinanceKline(selectedSym,interval,u=>{setKlines(prev=>{if(!prev.length)return prev;const l=prev[prev.length-1];if(u.time===l.time){const n=[...prev];n[n.length-1]=u;return n}else if(u.time>l.time&&u.isFinal)return[...prev,u].slice(-300);return prev});setHeaderPrice(u.close);if(u.open>0)setHeaderChange(((u.close-u.open)/u.open)*100)});wsCleanups.current.push(unsub)}else{fetchYFKlines(selectedSym,interval).then(d=>{setKlines(d);setLoading(false);if(d.length>0){const l=d[d.length-1];const p=d[d.length-2];setHeaderPrice(l.close);setHeaderChange(p?((l.close-p.close)/p.close)*100:0)}})}},[selectedSym,interval,currentAssetType]);
useEffect(()=>{if(assetType==='crypto'){fetchBinanceTickers().then(all=>{const m={};all.forEach(t=>{m[t.symbol]={price:parseFloat(t.lastPrice),changePct:parseFloat(t.priceChangePercent)}});setTickers(m)});const unsub=subscribeBinanceTickers(arr=>{setTickers(prev=>{const u={...prev};arr.forEach(t=>{if(CRYPTO_SYMBOLS.includes(t.s))u[t.s]={price:parseFloat(t.c),changePct:((parseFloat(t.c)-parseFloat(t.o))/parseFloat(t.o)*100)}});return u})});return()=>unsub()}else{const fetchAll=()=>INDIAN_INDICES.forEach(async ind=>{const q=await fetchYFQuote(ind.symbol);if(q)setIndianQuotes(p=>({...p,[ind.symbol]:q}))});fetchAll();const id=setInterval(fetchAll,30000);return()=>clearInterval(id)}},[assetType]);
useEffect(()=>{if(!chartRef.current||!klines.length||!window.LightweightCharts)return;if(seriesRef.current?.__chart){seriesRef.current.__chart.remove();seriesRef.current.__chart=null}const chart=window.LightweightCharts.createChart(chartRef.current,{width:chartRef.current.clientWidth,height:chartRef.current.clientHeight,layout:{background:{color:'transparent'},textColor:'#8b93a7',fontFamily:"'Inter',sans-serif"},grid:{vertLines:{color:'rgba(255,255,255,.04)'},horzLines:{color:'rgba(255,255,255,.04)'}},timeScale:{borderColor:'rgba(255,255,255,.08)',timeVisible:true},rightPriceScale:{borderColor:'rgba(255,255,255,.08)'},crosshair:{mode:window.LightweightCharts.CrosshairMode.Normal,vertLine:{color:'rgba(34,211,238,.3)',labelBackgroundColor:'#22d3ee'},horzLine:{color:'rgba(34,211,238,.3)',labelBackgroundColor:'#22d3ee'}}});const series=chart.addCandlestickSeries({upColor:'#16c784',downColor:'#ea3943',borderUpColor:'#16c784',borderDownColor:'#ea3943',wickUpColor:'#16c784',wickDownColor:'#ea3943'});series.setData(klines);const vol=chart.addHistogramSeries({color:'rgba(124,111,240,.3)',priceFormat:{type:'volume'},priceScaleId:''});vol.priceScale().applyOptions({scaleMargins:{top:.85,bottom:0}});vol.setData(klines.map(d=>({time:d.time,value:d.volume,color:'rgba(124,111,240,.2)'})));chart.timeScale().fitContent();seriesRef.current=series;seriesRef.current.__chart=chart;const resize=()=>{if(chartRef.current)chart.applyOptions({width:chartRef.current.clientWidth,height:chartRef.current.clientHeight})};window.addEventListener('resize',resize);return()=>{window.removeEventListener('resize',resize);chart.remove()}},[klines]);
useEffect(()=>{if(!seriesRef.current||!aiOverlay||klines.length<50)return;const closes=klines.map(d=>d.close);const signal=generateSignal(klines);const sr=calcSR(klines);if(seriesRef.current.__aiLines)seriesRef.current.__aiLines.forEach(l=>seriesRef.current.removePriceLine(l));const lines=[];lines.push(seriesRef.current.createPriceLine({price:closes[closes.length-1],color:signal.action==='BUY'?'#16c784':signal.action==='SELL'?'#ea3943':'#f59e0b',lineWidth:2,lineStyle:2,axisLabelVisible:true,title:`AI: ${signal.action}`}));sr.res?.slice(0,2).forEach(p=>lines.push(seriesRef.current.createPriceLine({price:p,color:'rgba(234,57,67,.5)',lineWidth:1,axisLabelVisible:true,title:'R'})));sr.sup?.slice(0,2).forEach(p=>lines.push(seriesRef.current.createPriceLine({price:p,color:'rgba(22,199,132,.5)',lineWidth:1,axisLabelVisible:true,title:'S'})));seriesRef.current.__aiLines=lines},[klines,aiOverlay]);
const displayLabel=currentAssetType==='crypto'?baseAsset(selectedSym)+'/USDT':(INDIAN_INDICES.find(i=>i.symbol===selectedSym)?.label||selectedSym);const cur=currentAssetType==='crypto'?'$':'₹';
return(<div className="app-shell"><div className="app-header"><div className="brand"><button className="sidebar-toggle" onClick={()=>setSidebarOpen(!sidebarOpen)}>☰</button><div className="brand-mark">⬡</div><div className="brand-name">Nexus<span className="brand-accent"> Terminal</span></div></div><div className="header-symbol-display"><span className="header-symbol">{displayLabel}</span><span className={`header-price mono ${headerChange!=null&&headerChange>=0?'up':'down'}`}>{cur}{fmtPrice(headerPrice)}<span className="header-change">{headerChange!=null?`${headerChange>=0?'+':''}${headerChange.toFixed(2)}%`:''}</span></span></div><div className="header-right">LIVE DATA</div></div><div className="app-body"><div className={`left-sidebar ${sidebarOpen?'':'hidden'}`}><div className="asset-tabs"><button className={`asset-tab ${assetType==='crypto'?'active':''}`} onClick={()=>{setAssetType('crypto');setSelectedSym('BTCUSDT')}}>Crypto</button><button className={`asset-tab ${assetType==='indian'?'active':''}`} onClick={()=>{setAssetType('indian');setSelectedSym('^NSEI')}}>Nifty / Sensex</button></div><div className="coin-list-panel"><div className="coin-search-wrap"><span className="search-icon">🔍</span><input type="text" placeholder="Search assets…" value={search} onChange={e=>setSearch(e.target.value)} />{search&&<button className="clear-btn" onClick={()=>setSearch('')}>×</button>}</div><div className="coin-list-scroll">{filteredList.length===0?<div className="coin-empty">No assets found</div>:filteredList.map(c=><CoinRow key={c.symbol} coin={c} active={c.symbol===selectedSym} onClick={()=>setSelectedSym(c.symbol)}/>)}</div></div></div><div className="center-content"><div className="chart-panel"><div className="chart-toolbar"><div className="interval-group">{['15m','1h','4h','1d','1w'].map(iv=><button key={iv} className={`interval-btn ${interval===iv?'active':''}`} onClick={()=>setInterval(iv)}>{iv}</button>)}</div><div className="toggle-group"><label className="mini-toggle"><input type="checkbox" checked={aiOverlay} onChange={e=>setAiOverlay(e.target.checked)}/>AI Signal Overlay</label></div>{loading&&<div className="chart-loading">Loading…</div>}</div><div className="chart-canvas" ref={chartRef}></div></div></div><div className="right-sidebar"><AnalysisPanel symbol={selectedSym} assetType={currentAssetType} data={klines}/></div></div></div>)}
const root=ReactDOM.createRoot(document.getElementById('root'));root.render(<App/>);
</script>
</body>
</html>
