<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo,useCallback} = React;

// ═══════════════════════════════════════════════════════
// FREE APIs — NO KEY NEEDED
// 1. Binance REST+WS  — crypto live prices + OHLCV
// 2. Yahoo Finance    — stocks OHLCV + fundamentals + news
// 3. CoinGecko        — crypto fundamentals + global market
// 4. Alternative.me   — Fear & Greed Index
// 5. CryptoPanic      — crypto news
// 6. Stooq.com        — backup OHLCV for Indian stocks
// 7. allorigins.win   — CORS proxy for Yahoo
// ═══════════════════════════════════════════════════════

const P1 = u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`;
const P2 = u => `https://corsproxy.io/?${encodeURIComponent(u)}`;

async function safeFetch(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r;
}

// ── Yahoo Finance ──────────────────────────────────────
async function yfetch(path) {
  const bases = ['https://query1.finance.yahoo.com','https://query2.finance.yahoo.com'];
  for (const b of bases) {
    for (const p of [P1, P2]) {
      try { const r = await safeFetch(p(b+path)); return await r.json(); } catch {}
    }
  }
  throw new Error('Yahoo Finance unavailable');
}

const TF_YF = {
  '1m':{iv:'1m',rng:'1d'},'5m':{iv:'5m',rng:'5d'},'15m':{iv:'15m',rng:'5d'},
  '1h':{iv:'60m',rng:'1mo'},'4h':{iv:'1h',rng:'3mo'},
  '1D':{iv:'1d',rng:'2y'},'1W':{iv:'1wk',rng:'5y'},
};

async function yfChart(symbol, tf) {
  const {iv,rng} = TF_YF[tf]||{iv:'1d',rng:'1y'};
  const j = await yfetch(`/v8/finance/chart/${encodeURIComponent(symbol)}?interval=${iv}&range=${rng}&includePrePost=false`);
  const res = j?.chart?.result?.[0];
  if (!res) throw new Error('No chart data');
  const ts=res.timestamp||[], q=res.indicators?.quote?.[0]||{};
  return ts.map((t,i)=>({time:t,open:q.open?.[i],high:q.high?.[i],low:q.low?.[i],close:q.close?.[i],volume:q.volume?.[i]||0}))
    .filter(d=>d.close!=null&&!isNaN(d.close));
}

async function yfFund(symbol) {
  const mods='price,financialData,summaryDetail,defaultKeyStatistics,assetProfile,earnings';
  const j = await yfetch(`/v10/finance/quoteSummary/${encodeURIComponent(symbol)}?modules=${mods}`);
  const r=j?.quoteSummary?.result?.[0];
  if (!r) throw new Error('No fundamental data');
  const pr=r.price||{},fd=r.financialData||{},sd=r.summaryDetail||{},ks=r.defaultKeyStatistics||{},ap=r.assetProfile||{};
  return {
    name:pr.longName||pr.shortName||symbol, exchange:pr.exchangeName, currency:pr.currency||'USD',
    marketCap:pr.marketCap?.raw, pe:sd.trailingPE?.raw, forwardPE:sd.forwardPE?.raw,
    eps:ks.trailingEps?.raw, revenue:fd.totalRevenue?.raw, grossMargin:fd.grossMargins?.raw,

async function yfNews(symbol) {
  const url=`https://feeds.finance.yahoo.com/rss/2.0/headline?s=${symbol}&lang=en-US`;
  for (const p of [P1,P2]) {
    try {
      const r = await safeFetch(p(url));
      const txt = await r.text();
      const doc = new DOMParser().parseFromString(txt,'text/xml');
      return Array.from(doc.querySelectorAll('item')).slice(0,18).map(item=>{
        const title=item.querySelector('title')?.textContent||'';
        const link=item.querySelector('link')?.textContent||'#';
        const date=item.querySelector('pubDate')?.textContent||'';
        const tl=title.toLowerCase();
        const bull=['surge','rally','beat','breakout','upgrade','buy','growth','record','soar','jump','gain','rise','profit','bull'];
        const bear=['crash','dump','miss','downgrade','sell','warning','loss','decline','fall','plunge','cut','fear','bear','drop'];
        const bs=bull.filter(k=>tl.includes(k)).length, ss=bear.filter(k=>tl.includes(k)).length;
        return {title,link,date,source:'Yahoo Finance',sentiment:bs>ss?'Bullish':ss>bs?'Bearish':'Neutral'};
      });
    } catch {}
  }
  return [];
}

// TECHNICAL INDICATORS
// ═══════════════════════════════════════════════════════
const I = {
  sma:(a,p)=>a.map((_,i)=>i<p-1?null:a.slice(i-p+1,i+1).reduce((x,y)=>x+y,0)/p),
  ema(a,p){
    const k=2/(p+1),out=[];
    for(let i=0;i<a.length;i++) out.push(i===0?a[0]:a[i]*k+out[i-1]*(1-k));
    return out;
  },
  rsi(a,p=14){
    const d=a.map((_,i)=>i===0?0:a[i]-a[i-1]);
    let ag=0,al=0;
    for(let i=1;i<=p;i++){ag+=Math.max(d[i],0)/p;al+=Math.max(-d[i],0)/p;}
    const out=Array(p).fill(null);
    out.push(al===0?100:100-100/(1+ag/al));
    for(let i=p+1;i<a.length;i++){
      ag=(ag*(p-1)+Math.max(d[i],0))/p;
      al=(al*(p-1)+Math.max(-d[i],0))/p;
      out.push(al===0?100:100-100/(1+ag/al));
    }
    return out;
  },
  macd(a,fast=12,slow=26,sig=9){
    const ef=I.ema(a,fast),es=I.ema(a,slow);
    const line=ef.map((v,i)=>v-es[i]);
    const signal=I.ema(line,sig);
    return {line,signal,hist:line.map((v,i)=>v-signal[i])};
  },
  bb(a,p=20,m=2){
    const sma=I.sma(a,p);
    return sma.map((mid,i)=>{
      if(mid===null) return {upper:null,mid:null,lower:null,pct:null};
      const sl=a.slice(i-p+1,i+1);
      const sd=Math.sqrt(sl.reduce((acc,v)=>acc+(v-mid)**2,0)/p);
      const upper=mid+m*sd,lower=mid-m*sd;
      const pct=upper===lower?50:(a[i]-lower)/(upper-lower)*100;
      return {upper,mid,lower,pct};
    });
  },
  atr(c,p=14){
    const tr=c.map((x,i)=>i===0?x.high-x.low:Math.max(x.high-x.low,Math.abs(x.high-c[i-1].close),Math.abs(x.low-c[i-1].close)));
    return I.ema(tr,p);
  },
  stoch(c,k=14,d=3){
    const ks=c.map((_,i)=>{
      if(i<k-1) return null;
      const sl=c.slice(i-k+1,i+1);
      const lo=Math.min(...sl.map(x=>x.low)),hi=Math.max(...sl.map(x=>x.high));
      return hi===lo?50:(c[i].close-lo)/(hi-lo)*100;
    });
    return {k:ks,d:I.sma(ks.filter(v=>v!==null),d)};
  },
  adx(c,p=14){
    if(c.length<p*2) return null;
    const pDM=[],mDM=[],TR=[];
    for(let i=1;i<c.length;i++){
      pDM.push(Math.max(c[i].high-c[i-1].high,0));
      mDM.push(Math.max(c[i-1].low-c[i].low,0));
      TR.push(Math.max(c[i].high-c[i].low,Math.abs(c[i].high-c[i-1].close),Math.abs(c[i].low-c[i-1].close)));
    }
    const atr=I.ema(TR,p),aPDM=I.ema(pDM,p),aMDM=I.ema(mDM,p);
    const pDI=aPDM.map((v,i)=>atr[i]>0?v/atr[i]*100:0);
    const mDI=aMDM.map((v,i)=>atr[i]>0?v/atr[i]*100:0);
    const DX=pDI.map((v,i)=>{const s=v+mDI[i];return s>0?Math.abs(v-mDI[i])/s*100:0;});
    const adxArr=I.ema(DX,p);
    const n=adxArr.length-1;
    return {adx:adxArr[n],pdi:pDI[n],mdi:mDI[n]};
  },
  williams(c,p=14){
    return c.map((_,i)=>{
      if(i<p-1) return null;
      const sl=c.slice(i-p+1,i+1);
      const hi=Math.max(...sl.map(x=>x.high)),lo=Math.min(...sl.map(x=>x.low));
      return hi===lo?-50:(hi-c[i].close)/(hi-lo)*-100;
    });
  },
  cci(c,p=20){
    return c.map((_,i)=>{
      if(i<p-1) return null;
      const sl=c.slice(i-p+1,i+1);
      const tps=sl.map(x=>(x.high+x.low+x.close)/3);
      const meanTP=tps.reduce((a,b)=>a+b,0)/p;
      const meanDev=tps.reduce((a,b)=>a+Math.abs(b-meanTP),0)/p;
      return meanDev===0?0:(tps[tps.length-1]-meanTP)/(0.015*meanDev);
    });
  },
  vwap(c){
    let cumVol=0,cumTpV=0;
    return c.map(x=>{
      const tp=(x.high+x.low+x.close)/3;
      cumVol+=x.volume; cumTpV+=tp*x.volume;
      return cumVol>0?cumTpV/cumVol:tp;
    });
  },
  sr(c,n=4){
    if(c.length<20) return {resistance:[],support:[]};
    const recent=c.slice(-100);
    const highs=[],lows=[];
    for(let i=3;i<recent.length-3;i++){
      const x=recent[i];
      if(x.high>recent[i-1].high&&x.high>recent[i-2].high&&x.high>recent[i-3].high&&x.high>recent[i+1].high&&x.high>recent[i+2].high&&x.high>recent[i+3].high) highs.push(x.high);
      if(x.low<recent[i-1].low&&x.low<recent[i-2].low&&x.low<recent[i-3].low&&x.low<recent[i+1].low&&x.low<recent[i+2].low&&x.low<recent[i+3].low) lows.push(x.low);
    }
    const last=recent[recent.length-1].close;
    const resistance=[...new Set(highs)].filter(v=>v>last).sort((a,b)=>a-b).slice(0,n);
    const support=[...new Set(lows)].filter(v=>v<last).sort((a,b)=>b-a).slice(0,n);
    return {resistance,support};
  },
  patterns(c){
    const res=[]; const n=c.length;
    for(let i=Math.max(2,n-6);i<n;i++){
      const x=c[i],p1=c[i-1],p2=c[i-2];
      const body=Math.abs(x.close-x.open),rng=x.high-x.low;
      const bull=x.close>x.open,prevBull=p1.close>p1.open;
      const uw=x.high-Math.max(x.open,x.close),lw=Math.min(x.open,x.close)-x.low;
      const avgBody=c.slice(Math.max(0,i-14),i).reduce((a,cc)=>a+Math.abs(cc.close-cc.open),0)/14||body;
      if(body<rng*0.05&&rng>0){
        if(uw>lw*2) res.push({name:'Gravestone Doji',type:'Bearish'});
        else if(lw>uw*2) res.push({name:'Dragonfly Doji',type:'Bullish'});
        else res.push({name:'Doji',type:'Neutral'});
        continue;
      }
      if(lw>=body*2&&uw<=body*0.3&&!bull) res.push({name:'Hammer',type:'Bullish'});
      else if(uw>=body*2&&lw<=body*0.3&&bull) res.push({name:'Shooting Star',type:'Bearish'});
      else if(uw>=body*2&&lw<=body*0.3&&!bull) res.push({name:'Inverted Hammer',type:'Bullish'});
      else if(lw>=body*2&&uw<=body*0.3&&bull) res.push({name:'Hanging Man',type:'Bearish'});
      if(bull&&!prevBull&&x.open<=p1.close&&x.close>=p1.open&&body>Math.abs(p1.close-p1.open)) res.push({name:'Bullish Engulfing',type:'Bullish'});
      else if(!bull&&prevBull&&x.open>=p1.close&&x.close<=p1.open&&body>Math.abs(p1.close-p1.open)) res.push({name:'Bearish Engulfing',type:'Bearish'});
      if(bull&&uw<=body*0.05&&lw<=body*0.05&&body>=avgBody*1.5) res.push({name:'Bullish Marubozu',type:'Bullish'});
      else if(!bull&&uw<=body*0.05&&lw<=body*0.05&&body>=avgBody*1.5) res.push({name:'Bearish Marubozu',type:'Bearish'});
      if(i>=2){
        const p2b=p2.close>p2.open,p2body=Math.abs(p2.close-p2.open);
        if(!p2b&&p2body>0.8*avgBody&&Math.abs(p1.close-p1.open)<p2body*0.3&&bull&&x.close>(p2.open+p2.close)/2) res.push({name:'Morning Star',type:'Bullish'});
        if(p2b&&p2body>0.8*avgBody&&Math.abs(p1.close-p1.open)<p2body*0.3&&!bull&&x.close<(p2.open+p2.close)/2) res.push({name:'Evening Star',type:'Bearish'});
        if(bull&&prevBull&&p2.close>p2.open&&x.close>p1.close&&p1.close>p2.close&&body>avgBody*.7&&Math.abs(p1.close-p1.open)>avgBody*.7) res.push({name:'Three White Soldiers',type:'Bullish'});
        if(!bull&&!prevBull&&!(p2.close>p2.open)&&x.close<p1.close&&p1.close<p2.close&&body>avgBody*.7) res.push({name:'Three Black Crows',type:'Bearish'});
      }
    }
    return res.slice(-5);
  }
};

// ═══════════════════════════════════════════════════════
// FORMAT HELPERS
// ═══════════════════════════════════════════════════════
const F = {
  price(v,sym='$'){
    if(v==null||isNaN(v)) return '--';
    const n=+v,a=Math.abs(n);
    const d=a<1?6:a<10?4:a<1000?2:2;
    return sym+n.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
  },
  compact(n){
    if(n==null||isNaN(n)) return '--';
    const a=Math.abs(n),pfx=n<0?'-':'';
    if(a>=1e12) return pfx+'$'+(a/1e12).toFixed(2)+'T';
    if(a>=1e9)  return pfx+'$'+(a/1e9).toFixed(2)+'B';
    if(a>=1e6)  return pfx+'$'+(a/1e6).toFixed(2)+'M';
    if(a>=1e3)  return pfx+'$'+(a/1e3).toFixed(2)+'K';
    return pfx+'$'+a.toFixed(2);
  },
  pct(n,d=1){ if(n==null||isNaN(n)) return '--'; return (n*100).toFixed(d)+'%'; },
  num(n,d=2){ if(n==null||isNaN(n)) return '--'; return (+n).toFixed(d); },
  ago(s){
    const sec=Math.floor((Date.now()-new Date(s))/1000);
    if(sec<60) return sec+'s';
    if(sec<3600) return Math.floor(sec/60)+'m';
    if(sec<86400) return Math.floor(sec/3600)+'h';
    return Math.floor(sec/86400)+'d';
  }
};

const TFS=['1m','5m','15m','1h','4h','1D','1W'];

function ChartPanel({symbol,type,tf,setTf,onData,showVol,setShowVol,showEMA,setShowEMA,showBB,setShowBB}) {
  const wrapRef=useRef(null);
  const chartRef=useRef(null);
  const csRef=useRef(null);
  const volRef=useRef(null);
  const e20Ref=useRef(null);
  const e50Ref=useRef(null);
  const bbURef=useRef(null);
  const bbLRef=useRef(null);
  const bbMRef=useRef(null);
  const wsRef=useRef(null);
  const [ldg,setLdg]=useState(true);
  const [err,setErr]=useState(null);

  useEffect(()=>{
    if(!wrapRef.current) return;
    const chart=LightweightCharts.createChart(wrapRef.current,{
      width:wrapRef.current.clientWidth, height:wrapRef.current.clientHeight,
      layout:{background:{type:'Solid',color:'#0a0e14'},textColor:'#545c6e'},
      grid:{vertLines:{color:'rgba(255,255,255,0.035)'},horzLines:{color:'rgba(255,255,255,0.035)'}},
      crosshair:{mode:LightweightCharts.CrosshairMode.Normal,vertLine:{color:'rgba(255,255,255,0.18)',labelBackgroundColor:'#1a2235'},horzLine:{color:'rgba(255,255,255,0.18)',labelBackgroundColor:'#1a2235'}},
      rightPriceScale:{borderColor:'rgba(255,255,255,0.05)',textColor:'#545c6e'},
      timeScale:{borderColor:'rgba(255,255,255,0.05)',timeVisible:true,secondsVisible:false,barSpacing:9},
    });
    const cs=chart.addCandlestickSeries({upColor:'#16c784',downColor:'#ea3943',borderUpColor:'#16c784',borderDownColor:'#ea3943',wickUpColor:'#16c784',wickDownColor:'#ea3943'});
    const vol=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol'});
    chart.priceScale('vol').applyOptions({scaleMargins:{top:0.85,bottom:0}});
    const e20=chart.addLineSeries({color:'rgba(34,211,238,0.7)',lineWidth:1.5,priceLineVisible:false,lastValueVisible:false});
    const e50=chart.addLineSeries({color:'rgba(124,111,240,0.7)',lineWidth:1.5,priceLineVisible:false,lastValueVisible:false});
    const bbU=chart.addLineSeries({color:'rgba(245,158,11,0.5)',lineWidth:1,priceLineVisible:false,lastValueVisible:false,lineStyle:2});
    const bbL=chart.addLineSeries({color:'rgba(245,158,11,0.5)',lineWidth:1,priceLineVisible:false,lastValueVisible:false,lineStyle:2});
    const bbM=chart.addLineSeries({color:'rgba(245,158,11,0.3)',lineWidth:1,priceLineVisible:false,lastValueVisible:false,lineStyle:1});
    const resize=()=>{if(wrapRef.current) chart.applyOptions({width:wrapRef.current.clientWidth,height:wrapRef.current.clientHeight});};
    window.addEventListener('resize',resize);
    chartRef.current=chart; csRef.current=cs; volRef.current=vol;
    e20Ref.current=e20; e50Ref.current=e50;
    bbURef.current=bbU; bbLRef.current=bbL; bbMRef.current=bbM;
    return ()=>{window.removeEventListener('resize',resize);chart.remove();};
  },[]);

  useEffect(()=>{
    if(!csRef.current) return;
    setLdg(true); setErr(null);
    if(wsRef.current){wsRef.current();wsRef.current=null;}
    loadChart(symbol,type,tf).then(data=>{
      if(!data.length){setErr('No data available');setLdg(false);return;}
      csRef.current.setData(data);
      // Volume
      const vd=data.map(d=>({time:d.time,value:d.volume,color:d.close>=d.open?'rgba(22,199,132,0.35)':'rgba(234,57,67,0.35)'}));
      volRef.current.setData(showVol?vd:[]);
      // EMAs
      const cls=data.map(d=>d.close);
      const e20d=I.ema(cls,20).map((v,i)=>({time:data[i].time,value:v}));
      const e50d=I.ema(cls,50).map((v,i)=>({time:data[i].time,value:v}));
      e20Ref.current.setData(showEMA?e20d:[]);
      e50Ref.current.setData(showEMA?e50d:[]);
      // BB
      const bbd=I.bb(cls,20,2);
      const bbu=bbd.map((b,i)=>b.upper!=null?{time:data[i].time,value:b.upper}:null).filter(Boolean);
      const bbl=bbd.map((b,i)=>b.lower!=null?{time:data[i].time,value:b.lower}:null).filter(Boolean);
      const bbm=bbd.map((b,i)=>b.mid!=null?{time:data[i].time,value:b.mid}:null).filter(Boolean);
      bbURef.current.setData(showBB?bbu:[]);
      bbLRef.current.setData(showBB?bbl:[]);
      bbMRef.current.setData(showBB?bbm:[]);
      chartRef.current.timeScale().fitContent();
      onData(data); setLdg(false);
      if(type==='CRYPTO') wsRef.current=bnKlineWS(symbol,tf,upd=>{
        csRef.current.update(upd);
        volRef.current.update({time:upd.time,value:upd.volume,color:upd.close>=upd.open?'rgba(22,199,132,0.35)':'rgba(234,57,67,0.35)'});
      });
    }).catch(e=>{setErr(e.message);setLdg(false);});
    return ()=>{if(wsRef.current){wsRef.current();wsRef.current=null;}};
  },[symbol,type,tf]);

  return (
    <div className="ctr">
      <div className="chart-bar">
        <div className="tfs">{TFS.map(t=><button key={t} className={`tfb${tf===t?' on':''}`} onClick={()=>setTf(t)}>{t}</button>)}</div>
        <div className="itogs">
          <button className={`itog${showVol?' on':''}`} onClick={()=>setShowVol(v=>!v)}>VOL</button>
          <button className={`itog${showEMA?' on':''}`} onClick={()=>setShowEMA(v=>!v)}>EMA</button>
          <button className={`itog${showBB?' on':''}`} onClick={()=>setShowBB(v=>!v)}>BB</button>
        </div>
      </div>
      {ldg&&<div className="chart-load"/>}
      {err&&!ldg&&<div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',textAlign:'center',color:'var(--faint)',fontSize:12,zIndex:5}}>⚠️ {err}</div>}
      <div className="chart-wrap" ref={wrapRef}/>
    </div>
  );
}

// TECHNICAL ANALYSIS TAB
// ═══════════════════════════════════════════════════════
function TechTab({ohlcv}) {
  const A=useMemo(()=>{
    if(!ohlcv||ohlcv.length<50) return null;
    const cls=ohlcv.map(d=>d.close), n=ohlcv.length, last=ohlcv[n-1], p=last.close;
    const rsiA=I.rsi(cls,14), rsi=rsiA[n-1];
    const macd=I.macd(cls); const mv=macd.line[n-1],sv=macd.signal[n-1],hv=macd.hist[n-1];
    const e9=I.ema(cls,9)[n-1], e20=I.ema(cls,20)[n-1], e50=I.ema(cls,50)[n-1];
    const e100=I.ema(cls,100)[n-1], e200=I.ema(cls,200)[n-1];
    const bbA=I.bb(cls,20,2), bb=bbA[n-1];
    const atrA=I.atr(ohlcv,14), atr=atrA[n-1];
    const stA=I.stoch(ohlcv,14,3), stk=stA.k[n-1];
    const adx=I.adx(ohlcv,14);
    const wA=I.williams(ohlcv,14), wr=wA[n-1];
    const cciA=I.cci(ohlcv,20), cci=cciA[n-1];
    const vwapA=I.vwap(ohlcv), vwap=vwapA[n-1];
    const sr=I.sr(ohlcv,5), pats=I.patterns(ohlcv);
    // Volume
    const vs=ohlcv.slice(-21).map(d=>d.volume);
    const avgVol=vs.slice(0,-1).reduce((a,b)=>a+b,0)/20;
    const volRatio=last.volume/avgVol;
    // OBV
    let obv=0;
    const obvArr=ohlcv.map((c,i)=>{if(i===0){obv=c.volume;return obv;}obv+=c.close>ohlcv[i-1].close?c.volume:c.close<ohlcv[i-1].close?-c.volume:0;return obv;});
    const obvTrend=obvArr[n-1]>obvArr[n-5]?'Rising':'Falling';
    // Pivot Points (Classic)
    const prevDay=ohlcv[n-2]||ohlcv[n-1];
    const pivot=(prevDay.high+prevDay.low+prevDay.close)/3;
    const r1=2*pivot-prevDay.low, s1=2*pivot-prevDay.high;
    const r2=pivot+(prevDay.high-prevDay.low), s2=pivot-(prevDay.high-prevDay.low);
    const r3=prevDay.high+2*(pivot-prevDay.low), s3=prevDay.low-2*(prevDay.high-pivot);
    // Signal scoring
    const sigs=[];
    const add=(score)=>sigs.push(score);
    add(rsi<30?2:rsi<40?1:rsi>70?-2:rsi>60?-1:0);
    add(hv>0&&mv>sv?2:hv>0?1:hv<0&&mv<sv?-2:-1);
    add(p>e20&&e20>e50?2:p>e20?1:p<e20&&e20<e50?-2:-1);
    add(e50>e200?1:-1);
    add(stk<20?2:stk>80?-2:0);
    add(bb&&p<=bb.lower*1.01?2:bb&&p>=bb.upper*0.99?-2:0);
    add(wr&&wr<-80?2:wr&&wr>-20?-2:0);
    add(cci&&cci<-100?2:cci&&cci>100?-2:0);
    const avg=sigs.reduce((a,b)=>a+b,0)/sigs.length;
    let overall,oc; if(avg>=1.5){overall='STRONG BUY';oc='buy';}else if(avg>=0.5){overall='BUY';oc='buy';}else if(avg<=-1.5){overall='STRONG SELL';oc='sell';}else if(avg<=-0.5){overall='SELL';oc='sell';}else{overall='NEUTRAL';oc='neutral';}
    return {rsi,mv,sv,hv,e9,e20,e50,e100,e200,bb,atr,stk,adx,wr,cci,vwap,sr,pats,overall,oc,avg,volRatio,obvTrend,pivot,r1,r2,r3,s1,s2,s3,p,last};
  },[ohlcv]);

  if(!A) return <div className="err-box"><div className="spin" style={{margin:'0 auto 8px'}}/><p>Computing indicators…</p></div>;
  const {rsi,mv,sv,hv,e9,e20,e50,e100,e200,bb,atr,stk,adx,wr,cci,vwap,sr,pats,overall,oc,avg,volRatio,obvTrend,pivot,r1,r2,r3,s1,s2,s3,p} = A;
  const sigClass=(v,buy,sb,sell,ss)=>v<=sb?'sb':v<=buy?'b':v>=ss?'ss':v>=sell?'s':'n';
  const pf=v=>F.price(v,'');

  return (
    <div>
      <div className={`overall ${oc}`}>
        <div className="overall-lbl">Overall Signal</div>
        <div className="overall-val" style={{color:oc==='buy'?'var(--green)':oc==='sell'?'var(--red)':'var(--dim)'}}>{overall}</div>
        <div style={{fontSize:9,color:'var(--faint)',marginTop:2}}>Score: {avg.toFixed(2)} | {sigs?.length||8} indicators</div>
      </div>

      <div className="sec-hd">Momentum Oscillators</div>
      <div className="ind-row">
        <span className="ind-lbl">RSI (14)</span>
        <span className="ind-val" style={{color:rsi<30?'var(--green)':rsi>70?'var(--red)':'var(--text)'}}>{F.num(rsi,1)}</span>
        <span className={`sig ${rsi<30?'sb':rsi<45?'b':rsi>70?'ss':rsi>55?'s':'n'}`}>{rsi<30?'OVERSOLD':rsi>70?'OVERBOUGHT':rsi<45?'BUY ZONE':rsi>55?'SELL ZONE':'NEUTRAL'}</span>
      </div>
      <div className="gauge">
        <div className="g-track">
          <div style={{width:'30%',height:'100%',background:'rgba(22,199,132,.3)'}}/>
          <div style={{width:'40%',height:'100%',background:'rgba(255,255,255,.05)'}}/>
          <div style={{width:'30%',height:'100%',background:'rgba(234,57,67,.3)'}}/>
          <div className="g-needle" style={{left:rsi+'%'}}/>
        </div>
        <div className="g-labels"><span>0</span><span>30</span><span>50</span><span>70</span><span>100</span></div>
      </div>

      <div className="ind-row">
        <span className="ind-lbl">Stochastic %K</span>
        <span className="ind-val">{F.num(stk,1)}</span>
        <span className={`sig ${stk<20?'sb':stk<35?'b':stk>80?'ss':stk>65?'s':'n'}`}>{stk<20?'OVERSOLD':stk>80?'OVERBOUGHT':'NEUTRAL'}</span>
      </div>

      {wr!=null&&<div className="ind-row">
        <span className="ind-lbl">Williams %R</span>
        <span className="ind-val">{F.num(wr,1)}</span>
        <span className={`sig ${wr<-80?'sb':wr<-65?'b':wr>-20?'ss':wr>-35?'s':'n'}`}>{wr<-80?'OVERSOLD':wr>-20?'OVERBOUGHT':'NEUTRAL'}</span>
      </div>}

      {cci!=null&&<div className="ind-row">
        <span className="ind-lbl">CCI (20)</span>
        <span className="ind-val">{F.num(cci,1)}</span>
        <span className={`sig ${cci<-100?'sb':cci<-50?'b':cci>100?'ss':cci>50?'s':'n'}`}>{cci<-100?'OVERSOLD':cci>100?'OVERBOUGHT':'NEUTRAL'}</span>
      </div>}

      <div className="sec-hd">MACD</div>
      <div className="ind-row">
        <span className="ind-lbl">MACD Line</span>
        <span className="ind-val" style={{color:mv>sv?'var(--green)':'var(--red)'}}>{F.num(mv,4)}</span>
        <span className={`sig ${hv>0&&mv>sv?'sb':hv>0?'b':hv<0&&mv<sv?'ss':'s'}`}>{hv>0?'BULLISH':'BEARISH'}</span>

        <div className="ind-row"><span className="ind-lbl">Middle Band</span><span className="ind-val">{pf(bb.mid)}</span></div>
        <div className="ind-row"><span className="ind-lbl">Lower Band</span><span className="ind-val">{pf(bb.lower)}</span><span className={`sig ${p<=bb.lower*1.01?'sb':'n'}`}>{p<=bb.lower*1.01?'AT LOWER':'—'}</span></div>
        <div className="ind-row"><span className="ind-lbl">%B Position</span><span className="ind-val">{F.num(bb.pct,1)}%</span><span className={`sig ${bb.pct>80?'ss':bb.pct<20?'sb':'n'}`}>{bb.pct>80?'OVERBOUGHT':bb.pct<20?'OVERSOLD':'NORMAL'}</span></div>
        <div className="ind-row"><span className="ind-lbl">Band Width</span><span className="ind-val">{F.num((bb.upper-bb.lower)/bb.mid*100,2)}%</span></div>
      </>}

      <div className="sec-hd">Volatility & Volume</div>
      <div className="ind-row"><span className="ind-lbl">ATR (14)</span><span className="ind-val">{pf(atr)}</span></div>
      {vwap&&<div className="ind-row"><span className="ind-lbl">VWAP</span><span className="ind-val">{pf(vwap)}</span><span className={`sig ${p>vwap?'b':'s'}`}>{p>vwap?'ABOVE':'BELOW'}</span></div>}
      <div className="ind-row"><span className="ind-lbl">Volume vs Avg</span><span className="ind-val">{F.num(volRatio*100,0)}%</span><span className={`sig ${volRatio>1.5?'sb':volRatio<0.5?'s':'n'}`}>{volRatio>1.5?'HIGH':volRatio<0.5?'LOW':'NORMAL'}</span></div>
      <div className="ind-row"><span className="ind-lbl">OBV Trend</span><span className={`sig ${obvTrend==='Rising'?'b':'s'}`}>{obvTrend==='Rising'?'↑ RISING':'↓ FALLING'}</span></div>

      <div className="sec-hd">Pivot Points (Classic)</div>
      <div className="ind-row"><span className="ind-lbl">Pivot</span><span className="ind-val" style={{color:'var(--cyan)'}}>{pf(pivot)}</span></div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'4px'}}>
        {[{l:'R3',v:r3},{l:'R2',v:r2},{l:'R1',v:r1}].map(x=><div key={x.l} className="ind-row"><span className="ind-lbl">{x.l}</span><span className="ind-val" style={{color:'var(--red)'}}>{pf(x.v)}</span></div>)}
        {[{l:'S1',v:s1},{l:'S2',v:s2},{l:'S3',v:s3}].map(x=><div key={x.l} className="ind-row"><span className="ind-lbl">{x.l}</span><span className="ind-val" style={{color:'var(--green)'}}>{pf(x.v)}</span></div>)}
      </div>

      <div className="sec-hd">Support & Resistance</div>
      <div className="sr-grid">
        <div><div className="sr-hd r">Resistance</div>{sr.resistance.map((v,i)=><div key={i} className="sr-lv">{pf(v)}</div>)}{!sr.resistance.length&&<div className="sr-lv" style={{fontStyle:'italic',color:'var(--faint)'}}>None</div>}</div>
        <div><div className="sr-hd s">Support</div>{sr.support.map((v,i)=><div key={i} className="sr-lv">{pf(v)}</div>)}{!sr.support.length&&<div className="sr-lv" style={{fontStyle:'italic',color:'var(--faint)'}}>None</div>}</div>
      </div>

      {pats.length>0&&<><div className="sec-hd">Candlestick Patterns</div>
        <div>{pats.map((pt,i)=><span key={i} className={`pc ${pt.type==='Bullish'?'b':pt.type==='Bearish'?'s':'n'}`}>{pt.name}</span>)}</div>
      </>}
    </div>
  );
}

function FundTab({symbol,type,base}) {
  const [d,setD]=useState(null);
  const [ldg,setLdg]=useState(true);
  const [err,setErr]=useState(null);

  useEffect(()=>{
    setLdg(true);setD(null);setErr(null);
    (async()=>{
      try {
        if(type==='CRYPTO'){
          const j=await cgCoin(base);
          const md=j.market_data||{};
          setD({type:'crypto',name:j.name,rank:j.market_cap_rank,
            desc:j.description?.en?.replace(/<[^>]+>/g,'')?.slice(0,600),
            link:j.links?.homepage?.[0],twitter:j.links?.twitter_screen_name,
            marketCap:md.market_cap?.usd,fdv:md.fully_diluted_valuation?.usd,
            circSupply:md.circulating_supply,totalSupply:md.total_supply,maxSupply:md.max_supply,
            ath:md.ath?.usd,atl:md.atl?.usd,
            c7d:md.price_change_percentage_7d_in_currency?.usd,
            c30d:md.price_change_percentage_30d_in_currency?.usd,
            c1y:md.price_change_percentage_1y_in_currency?.usd,
            vol24:md.total_volume?.usd,
            twFollowers:j.community_data?.twitter_followers,
            redditSubs:j.community_data?.reddit_subscribers,
          });
        } else {
          const fd=await yfFund(symbol);
          setD({type:'stock',...fd});
        }
      } catch(e){setErr(e.message);}
      setLdg(false);
    })();
  },[symbol,type,base]);

  if(ldg) return <div className="err-box"><div className="spin" style={{margin:'0 auto 8px'}}/></div>;
  if(err) return <div className="err-box">⚠️ {err}<br/><small style={{color:'var(--faint)',lineHeight:1.5}}>Data may be rate-limited. Wait 60s and retry.</small></div>;
  if(!d) return null;

  const FR=({label,val,cls})=>(

  );
  const pc=v=>v==null?'':v>0?'p':'n';

  if(d.type==='crypto') return (
    <div>
      {d.rank&&<div style={{padding:'6px 9px',marginBottom:7,background:'rgba(34,211,238,.05)',border:'1px solid rgba(34,211,238,.15)',borderRadius:7,fontSize:11,color:'var(--cyan)',fontWeight:700}}>🏆 Market Cap Rank #{d.rank}</div>}
      <div className="sec-hd">Market Data</div>
      <div className="fund-blk">
        <FR label="Market Cap" val={F.compact(d.marketCap)}/>
        <FR label="FDV" val={F.compact(d.fdv)}/>
        <FR label="24h Volume" val={F.compact(d.vol24)}/>
        <FR label="Circ. Supply" val={d.circSupply?d.circSupply.toLocaleString():'—'}/>
        <FR label="Total Supply" val={d.totalSupply?d.totalSupply.toLocaleString():'Unlimited'}/>
        <FR label="Max Supply" val={d.maxSupply?d.maxSupply.toLocaleString():'—'}/>
      </div>
      <div className="sec-hd">Price History</div>
      <div className="fund-blk">
        <FR label="All-Time High" val={F.price(d.ath)} cls="p"/>
        <FR label="All-Time Low" val={F.price(d.atl)} cls="n"/>
        <FR label="7D Change" val={d.c7d!=null?F.num(d.c7d,1)+'%':'—'} cls={pc(d.c7d)}/>
        <FR label="30D Change" val={d.c30d!=null?F.num(d.c30d,1)+'%':'—'} cls={pc(d.c30d)}/>
        <FR label="1Y Change" val={d.c1y!=null?F.num(d.c1y,1)+'%':'—'} cls={pc(d.c1y)}/>
      </div>

      {d.desc&&<><div className="sec-hd">About</div><div className="about">{d.desc}…</div></>}
      {d.link&&<a href={d.link} target="_blank" rel="noreferrer" style={{display:'block',marginTop:7,fontSize:11,color:'var(--cyan)',textDecoration:'none'}}>🌐 Official Website →</a>}

  // Stock
  return (

      <div className="sec-hd">Valuation</div>

        <FR label="Market Cap" val={F.compact(d.marketCap)}/>

        <FR label="Forward P/E" val={d.forwardPE?F.num(d.forwardPE):'N/A'}/>
        <FR label="P/B Ratio" val={d.priceToBook?F.num(d.priceToBook):'N/A'} cls={d.priceToBook&&d.priceToBook<1?'p':''}/>
        <FR label="EPS (TTM)" val={d.eps?'$'+F.num(d.eps):'N/A'} cls={d.eps!=null&&d.eps>0?'p':'n'}/>
        <FR label="Beta" val={d.beta?F.num(d.beta):'N/A'} cls={d.beta&&d.beta>1.5?'w':''}/>
      </div>

      <div className="sec-hd">Financial Health</div>
      <div className="fund-blk">
        <FR label="Revenue (TTM)" val={F.compact(d.revenue)}/>

        <FR label="Gross Margin" val={d.grossMargin!=null?F.pct(d.grossMargin):'—'} cls={d.grossMargin&&d.grossMargin>0.4?'p':''}/>

        <FR label="Debt/Equity" val={d.debtToEquity!=null?F.num(d.debtToEquity):'—'} cls={d.debtToEquity!=null&&d.debtToEquity>2?'n':d.debtToEquity!=null&&d.debtToEquity<0.5?'p':'w'}/>

      <div className="sec-hd">Price Levels</div>
      <div className="fund-blk">
        <FR label="52W High" val={d.high52w?'$'+F.num(d.high52w):'—'} cls="p"/>

        <FR label="200D MA" val={d.ma200?'$'+F.num(d.ma200):'—'}/>
        <FR label="Avg Volume" val={d.avgVol?d.avgVol.toLocaleString():'—'}/>
        <FR label="Book Value" val={d.bookValue?'$'+F.num(d.bookValue):'—'}/>
        <FR label="Short Ratio" val={d.shortRatio?F.num(d.shortRatio)+'x':'—'} cls={d.shortRatio&&d.shortRatio>5?'n':''}/>
      </div>

      {d.dividendYield>0&&<><div className="sec-hd">Dividends</div>
        <div className="fund-blk"><FR label="Dividend Yield" val={F.pct(d.dividendYield)} cls="p"/></div>
      </>}

      {d.numAnalysts>0&&<><div className="sec-hd">Analyst Consensus ({d.numAnalysts} analysts)</div>
        <div className="fund-blk">
          <div style={{fontSize:14,fontWeight:800,textTransform:'uppercase',color:d.recommendation?.includes('buy')?'var(--green)':d.recommendation?.includes('sell')?'var(--red)':'var(--amber)',marginBottom:6,textAlign:'center'}}>
            {(d.recommendation||'').replace(/_/g,' ')}
          </div>
          {d.targetMean&&<FR label="Price Target (Avg)" val={'$'+F.num(d.targetMean)} cls="p"/>}
          {d.targetLow&&d.targetHigh&&<FR label="Target Range" val={`$${F.num(d.targetLow)} – $${F.num(d.targetHigh)}`}/>}

      </>}

      {d.employees&&<><div className="sec-hd">Company Info</div>
        <div className="fund-blk">
          <FR label="Sector" val={d.sector||'—'}/>
          <FR label="Industry" val={d.industry||'—'}/>
          <FR label="Country" val={d.country||'—'}/>
          <FR label="Employees" val={d.employees?d.employees.toLocaleString():'—'}/>
        </div>
      </>}

      {d.description&&<><div className="sec-hd">About</div><div className="about">{d.description}</div></>}
    </div>
  );
}

// NEWS & VIDEO TAB
// ═══════════════════════════════════════════════════════
function NewsTab({symbol,type,base}) {
  const [news,setNews]=useState([]);
  const [ldg,setLdg]=useState(true);
  const [err,setErr]=useState(null);

  useEffect(()=>{
    setLdg(true);setNews([]);setErr(null);
    (async()=>{
      try {
        let items=[];
        if(type==='CRYPTO'){
          try {
            const j=await cpNews(base);
            items=(j.results||[]).map(n=>({
              title:n.title,link:n.url,date:n.created_at,source:n.source?.title||'CryptoPanic',
              sentiment:n.votes?.positive>n.votes?.negative?'Bullish':n.votes?.negative>n.votes?.positive?'Bearish':'Neutral',
              type:'news'
            }));
          } catch {
            items=await yfNews(base+'-USD');
            items=items.map(n=>({...n,type:'news'}));
          }
        } else {
          items=await yfNews(symbol);
          items=items.map(n=>({...n,type:'news'}));
        }
        setNews(items.slice(0,20));
      } catch(e){setErr(e.message);}
      setLdg(false);
    })();
  },[symbol,type,base]);

  if(ldg) return <div className="err-box"><div className="spin" style={{margin:'0 auto 8px'}}/></div>;
  if(err) return <div className="err-box">⚠️ {err}</div>;
  if(!news.length) return <div className="err-box">No news found.</div>;

  const bulls=news.filter(n=>n.sentiment==='Bullish').length;
  const bears=news.filter(n=>n.sentiment==='Bearish').length;
  const total=news.length;
  const bullPct=Math.round(bulls/total*100);

  // YouTube search URL for the asset
  const ytQuery=encodeURIComponent(`${symbol.replace('USDT','').replace('.NS','').replace('.BO','')} stock analysis 2024`);
  const ytUrl=`https://www.youtube.com/results?search_query=${ytQuery}`;

  return (
    <div>
      {/* Sentiment meter */}
      <div className="sent-meter">
        <span style={{color:'var(--faint)'}}>Sentiment ({total} articles)</span>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span style={{fontSize:11,color:'var(--green)',fontWeight:700}}>{bullPct}% 🟢</span>
          <div style={{width:50,height:5,background:'rgba(255,255,255,.07)',borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',width:bullPct+'%',background:'var(--green)'}}/>
          </div>
          <span style={{fontSize:11,color:'var(--red)',fontWeight:700}}>{Math.round(bears/total*100)}% 🔴</span>
        </div>
      </div>

      {/* YouTube Video Button */}
      <a href={ytUrl} target="_blank" rel="noreferrer" className="news-vid">
        <div className="yt-play">▶</div>
        <div>
          <div className="vid-ttl">Watch {symbol.replace('USDT','').replace('.NS','').replace('.BO','')} Analysis Videos on YouTube</div>
          <div className="vid-src">📺 YouTube · Click to search latest videos</div>
        </div>
      </a>

      {/* News Items */}
      {news.map((n,i)=>(
        <a key={i} href={n.link} target="_blank" rel="noreferrer" className="news-item">
          <div className="news-ttl">{n.title}</div>
          <div className="news-meta">
            <span className={`sent ${n.sentiment==='Bullish'?'bull':n.sentiment==='Bearish'?'bear':'neut'}`}>{n.sentiment}</span>
            <span>{n.source}</span>
            <span>{F.ago(n.date)}</span>
          </div>
        </a>
      ))}
    </div>
  );
}

      <div className="sec-hd">Top Gainers (24h)</div>
      {gainers.map(g=><div key={g.s} className="gain-row"><span style={{color:'var(--dim)',fontWeight:600}}>{g.s.replace('USDT','')}</span><span style={{color:'var(--green)',fontFamily:'var(--fm)',fontWeight:700}}>+{g.c.toFixed(2)}%</span></div>)}

      <div className="sec-hd" style={{marginTop:10}}>Top Losers (24h)</div>
      {losers.map(g=><div key={g.s} className="gain-row"><span style={{color:'var(--dim)',fontWeight:600}}>{g.s.replace('USDT','')}</span><span style={{color:'var(--red)',fontFamily:'var(--fm)',fontWeight:700}}>{g.c.toFixed(2)}%</span></div>)}

      {tr.length>0&&<><div className="sec-hd" style={{marginTop:10}}>🔥 Trending</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
          {tr.map((t,i)=><span key={i} style={{fontSize:10,padding:'2px 8px',background:'rgba(124,111,240,.1)',border:'1px solid rgba(124,111,240,.2)',borderRadius:10,color:'var(--violet)',fontWeight:700}}>#{i+1} {t.item?.symbol}</span>)}
        </div>
      </>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// AI INSIGHTS TAB
// ═══════════════════════════════════════════════════════
function AITab({ohlcv,symbol}) {
  const ins=useMemo(()=>{
    if(!ohlcv||ohlcv.length<50) return null;
    const cls=ohlcv.map(d=>d.close), n=ohlcv.length, last=ohlcv[n-1], p=last.close;
    const rsi=I.rsi(cls,14)[n-1];
    const macd=I.macd(cls); const hv=macd.hist[n-1], mv=macd.line[n-1], sv=macd.signal[n-1];
    const e20=I.ema(cls,20)[n-1], e50=I.ema(cls,50)[n-1], e200=I.ema(cls,200)[n-1];
    const bb=I.bb(cls,20,2)[n-1];
    const atr=I.atr(ohlcv,14)[n-1];
    const sr=I.sr(ohlcv,3);
    const pats=I.patterns(ohlcv);
    const adx=I.adx(ohlcv,14);
    const trend=p>e50?'bullish':'bearish';
    const rsiS=rsi<30?'severely oversold (extreme opportunity zone)':rsi<40?'mildly oversold':rsi>70?'severely overbought (caution zone)':rsi>60?'mildly overbought':'neutral territory';
    const macdS=hv>0&&mv>sv?'strongly bullish (positive histogram + above signal)':hv>0?'mildly bullish':hv<0&&mv<sv?'strongly bearish (negative histogram + below signal)':'mildly bearish';
    const emaS=p>e20&&e20>e50?'in full bullish alignment (price > EMA20 > EMA50)':p<e20&&e20<e50?'in full bearish alignment (price < EMA20 < EMA50)':'showing mixed EMA signals — consolidation or reversal likely';
    const bbS=bb?p>=bb.upper*0.99?'near upper BB (overbought zone)':p<=bb.lower*1.01?'near lower BB (strong support zone)':'inside the Bollinger Band range (normal)':'';
    const adxS=adx?adx.adx>40?'strong directional trend (ADX>40)':adx.adx>25?'trending market (ADX>25)':'ranging/consolidating market (ADX<25)':'';
    const entry=trend==='bullish'?`Buy dips to EMA-20 (~${F.price(e20,'')}), confirmed with volume spike`:
      `Short bounces to EMA-20 (~${F.price(e20,'')}), with tight stops`;
    const sl=trend==='bullish'?sr.support[0]?`Below ${F.price(sr.support[0],'')} (key support)`:'Below recent swing low':
      sr.resistance[0]?`Above ${F.price(sr.resistance[0],'')} (key resistance)`:'Above recent swing high';
    const tp1=trend==='bullish'?sr.resistance[0]?F.price(sr.resistance[0],''):F.price(p*1.05,''):sr.support[0]?F.price(sr.support[0],''):F.price(p*0.95,'');
    const tp2=trend==='bullish'?sr.resistance[1]?F.price(sr.resistance[1],''):F.price(p*1.1,''):sr.support[1]?F.price(sr.support[1],''):F.price(p*0.9,'');
    let score=0;
    if(rsi<40) score+=2; else if(rsi>60) score-=2;
    if(hv>0) score+=2; else score-=2;
    if(p>e50) score+=2; else score-=2;
    if(e50>e200) score+=1; else score-=1;
    if(adx&&adx.adx>25) score+=(adx.pdi>adx.mdi?1:-1);
    const verdict=score>=5?'STRONG BUY 🚀':score>=3?'BUY 📈':score<=-5?'STRONG SELL 💥':score<=-3?'SELL 📉':'NEUTRAL ⚖️';
    const vColor=verdict.includes('BUY')?'var(--green)':verdict.includes('SELL')?'var(--red)':'var(--dim)';
    return {rsi,hv,mv,sv,e20,e50,e200,atr,bb,pats,verdict,vColor,score,trend,rsiS,macdS,emaS,bbS,adxS,entry,sl,tp1,tp2,sr,p};
  },[ohlcv]);

  if(!ins) return <div className="err-box"><div className="spin" style={{margin:'0 auto 8px'}}/><p style={{marginTop:6}}>Computing AI analysis…</p></div>;
  const {rsi,hv,e20,e50,pats,verdict,vColor,score,trend,rsiS,macdS,emaS,bbS,adxS,entry,sl,tp1,tp2} = ins;

  return (
    <div>
      <div className="ai-card">
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
          <div style={{width:30,height:30,borderRadius:8,background:'var(--violet)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}>🤖</div>
          <div>
            <div style={{fontSize:9,fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--violet)'}}>FinsageAI Engine</div>
            <div style={{fontSize:10,color:'var(--faint)'}}>{symbol} · Rule-based analysis</div>
          </div>
        </div>
        <div className="ai-verdict" style={{color:vColor}}>{verdict}</div>
        <div className="ai-score">Score: {score>0?'+':''}{score}/6 · Trend: {trend.toUpperCase()}</div>
        <div className="ai-txt">
          <strong>{symbol}</strong> is in a <strong>{trend}</strong> structure. RSI({F.num(rsi,1)}) is {rsiS}. MACD is {macdS}. Price is {emaS}. {bbS&&<>Price is {bbS}. </>}{adxS&&<>Trend meter shows {adxS}.</>}
        </div>
      </div>

      {pats.length>0&&<><div className="sec-hd">Detected Patterns</div>
        <div style={{marginBottom:10}}>{pats.map((pt,i)=><span key={i} className={`pc ${pt.type==='Bullish'?'b':pt.type==='Bearish'?'s':'n'}`}>{pt.name}</span>)}</div>
      </>}

      <div className="sec-hd">Strategy Blueprint</div>
      <div className="strat">
        <div className="strat-row"><div className="strat-key">ENTRY</div><div className="strat-val">{entry}</div></div>
        <div className="strat-row"><div className="strat-key">STOP</div><div className="strat-val">{sl}</div></div>
        <div className="strat-row"><div className="strat-key">TARGET 1</div><div className="strat-val">{tp1}</div></div>
        <div className="strat-row"><div className="strat-key">TARGET 2</div><div className="strat-val">{tp2}</div></div>
        <div className="strat-row"><div className="strat-key">R:R</div><div className="strat-val">Aim for minimum 1:2 Risk/Reward ratio</div></div>
      </div>
      <div className="disc">⚠️ This AI analysis is generated by rule-based algorithms for educational purposes only. Not SEBI/FINRA registered investment advice. Always do your own research (DYOR) before trading.</div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// TRADINGVIEW TAB
// ═══════════════════════════════════════════════════════
function TVTab({symbol,type}) {
  const tvSym = type==='CRYPTO'
    ? `BINANCE:${symbol}`
    : symbol.replace('.NS',':NSE').replace('.BO',':BSE').startsWith('^')
      ? symbol.replace('^NSEI','NSE:NIFTY').replace('^BSESN','BSE:SENSEX').replace('^','').replace('GSPC','SP:SPX').replace('DJI','DJ:DJI').replace('IXIC','NASDAQ:IXIC')
      : symbol.replace(/\.(L|DE|T|NS|BO)$/,'');
  return (
    <iframe
      className="tv-frame"
      src={`https://www.tradingview.com/widgetbar-chart/?symbol=${encodeURIComponent(tvSym)}&theme=dark&interval=D&style=1&locale=en&toolbar_bg=%230a0e14&enable_publishing=false&hide_side_toolbar=false&allow_symbol_change=true`}
      title="TradingView"
    />
  );
}

// ═══════════════════════════════════════════════════════
// HEADER
// ═══════════════════════════════════════════════════════
function Header({symbol,type,base,cpx}) {
  const [clock,setClock]=useState('');
  const [sqPx,setSqPx]=useState(null);
  const [idxPx,setIdxPx]=useState({});

  useEffect(()=>{
    const t=setInterval(()=>setClock(new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})),1000);
    return ()=>clearInterval(t);
  },[]);

  // fetch index prices
  useEffect(()=>{
    const syms=INDICES.map(i=>i.sym);
    const load=()=>yfBatch(syms).then(r=>setIdxPx(r)).catch(()=>{});
    load();
    const iv=setInterval(load,30000);
    return ()=>clearInterval(iv);
  },[]);

  // fetch stock price if stock mode
  useEffect(()=>{
    if(type!=='STOCK'){setSqPx(null);return;}
    const load=()=>yfBatch([symbol]).then(r=>setSqPx(r[symbol]||null)).catch(()=>{});
    load();
    const iv=setInterval(load,15000);
    return ()=>clearInterval(iv);
  },[symbol,type]);

  const px=type==='CRYPTO'?cpx[symbol]:sqPx;
  const price=px?F.price(px.p):'—';
  const chg=px?+px.c:null;
  const up=chg>=0;

  return (
    <header className="hdr">
      <div className="logo">
        <div className="logo-mark">N</div>
        <span className="logo-name">Finsage<span className="logo-accent">AI</span></span>
      </div>
      <div className="hdr-center">
        <span className="hdr-sym">{symbol.replace('USDT','').replace(/\.(NS|BO|L|DE|T)$/,'').replace('^','')}{type==='CRYPTO'?'/USDT':''}</span>
        <span className={`hdr-price ${up?'up':'dn'}`}>{price}{chg!=null&&<span className="hdr-chg"> {up?'+':''}{chg.toFixed(2)}%</span>}</span>
        <div className="hdr-indices">
          {INDICES.map(idx=>{
            const d=idxPx[idx.sym]; const v=d?F.price(d.p,''):'—'; const c=d?+d.c:null;
            return (
              <div key={idx.key} className="idx-chip" title={idx.label}>
                <span className="idx-name">{idx.label}</span>
                <span className={`idx-val ${c!=null&&c>=0?'up':'dn'}`}>{v}</span>
                {c!=null&&<span style={{fontSize:9,color:c>=0?'var(--green)':'var(--red)'}}>{c>=0?'+':''}{c.toFixed(2)}%</span>}
              </div>
            );
          })}
        </div>
      </div>
      <div className="hdr-right">
        <div className="live-dot"/>
        <span>LIVE</span>
        <span style={{marginLeft:6,fontFamily:'var(--fm)'}}>{clock}</span>
      </div>
    </header>
  );
}

// ═══════════════════════════════════════════════════════
// RIGHT PANEL
// ═══════════════════════════════════════════════════════
const TABS=[
  {id:'tech',l:'Technical'},{id:'fund',l:'Fundamentals'},
  {id:'news',l:'News & Video'},{id:'market',l:'Market'},
  {id:'ai',l:'AI Insights'},{id:'tv',l:'TradingView'},
];

function RightPanel({symbol,type,base,ohlcv,cpx}) {
  const [tab,setTab]=useState('tech');
  useEffect(()=>setTab('tech'),[symbol]);
  return (
    <div className="right">
      <div className="panel-hdr">
        <div className="panel-ttl">{symbol.replace('USDT','').replace(/\.(NS|BO|L|DE|T)$/,'').replace('^','')}</div>
        <div className="panel-sub">{type==='CRYPTO'?'Cryptocurrency · Binance':'Equity · Yahoo Finance'} · Live Analysis</div>
      </div>
      <div className="tabs-row">
        {TABS.map(t=><button key={t.id} className={`tab${tab===t.id?' on':''}`} onClick={()=>setTab(t.id)}>{t.l}</button>)}
      </div>
      <div className="tab-body">
        {tab==='tech'   && <TechTab   ohlcv={ohlcv}/>}
        {tab==='fund'   && <FundTab   symbol={symbol} type={type} base={base}/>}
        {tab==='news'   && <NewsTab   symbol={symbol} type={type} base={base}/>}
        {tab==='market' && <MarketTab cpx={cpx}/>}
        {tab==='ai'     && <AITab     ohlcv={ohlcv} symbol={symbol}/>}
        {tab==='tv'     && <TVTab     symbol={symbol} type={type}/>}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════════════════════
function App() {
  const [mode,setMode]     = useState('CRYPTO');
  const [symbol,setSymbol] = useState('BTCUSDT');
  const [type,setType]     = useState('CRYPTO');
  const [base,setBase]     = useState('BTC');
  const [tf,setTf]         = useState('1h');
  const [ohlcv,setOhlcv]   = useState([]);
  const [showVol,setShowVol]= useState(true);
  const [showEMA,setShowEMA]= useState(false);
  const [showBB,setShowBB]  = useState(false);
  const [cpx,setCpx]       = useState({});

  // Binance live ticker for all crypto
  useEffect(()=>{
    const unsub=bnTickerWS(updates=>setCpx(prev=>({...prev,...updates})));
    return unsub;
  },[]);

  const onSelect=useCallback((sym,tp,name,bs)=>{
    setSymbol(sym);setType(tp);setBase(bs);
  },[]);

  useEffect(()=>{
    if(mode==='CRYPTO') onSelect('BTCUSDT','CRYPTO','Bitcoin','BTC');
    else onSelect('RELIANCE.NS','STOCK','Reliance','RELIANCE');
  },[mode]);

  return (
    <div className="shell">
      <Header symbol={symbol} type={type} base={base} cpx={cpx}/>
      <div className="body">
        <LeftBar mode={mode} setMode={setMode} active={symbol} onSelect={onSelect} cpx={cpx}/>
        <ChartPanel symbol={symbol} type={type} tf={tf} setTf={setTf} onData={setOhlcv}
          showVol={showVol} setShowVol={setShowVol}
          showEMA={showEMA} setShowEMA={setShowEMA}
          showBB={showBB} setShowBB={setShowBB}/>
        <RightPanel symbol={symbol} type={type} base={base} ohlcv={ohlcv} cpx={cpx}/>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
