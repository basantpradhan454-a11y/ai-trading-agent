<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Terminal | Professional Asset Intelligence & Trading</title>
    
    <!-- Design System: Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Scripts: React & Charting Core -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        :root {
            --bg: #0a0e14;
            --bg-deep: #060811;
            --panel: rgba(18, 22, 31, 0.72);
            --cyan: #22d3ee;
            --violet: #7c6ff0;
            --green: #16c784;
            --red: #ea3943;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --text-dark: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            background: radial-gradient(circle at 10% 10%, rgba(124, 111, 240, 0.12), transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(34, 211, 238, 0.08), transparent 40%),
                        var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            cursor: default;
        }

        /* Typefaces */
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        /* Component Classes */
        .glass {
            background: var(--panel);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .pulse-live {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--green);
            animation: pulse-op 2s infinite ease-in-out;
        }
        @keyframes pulse-op {
            0% { opacity: 0.4; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.4; transform: scale(0.85); }
        }

        .tab-indicator {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Asset Rows */
        .asset-item {
            border-left: 3px solid transparent;
            transition: all 0.15s ease-out;
        }
        .asset-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .asset-item.active {
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.08), transparent);
            border-left-color: var(--cyan);
        }

        /* Grid Layout */
        .terminal-shell {
            display: grid;
            grid-template-rows: 64px 1fr;
            height: 100vh;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 280px 1fr 340px;
            overflow: hidden;
        }

        /* Technical Indicator Gauges */
        .gauge-bg { height: 6px; border-radius: 10px; background: rgba(255,255,255,0.05); position: relative; overflow: hidden; }
        .gauge-fill { height: 100%; border-radius: 10px; transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

        .badge-base {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-buy { background: rgba(22, 199, 132, 0.12); color: var(--green); border: 1px solid rgba(22, 199, 132, 0.2); }
        .badge-sell { background: rgba(234, 57, 67, 0.12); color: var(--red); border: 1px solid rgba(234, 57, 67, 0.2); }
        .badge-hold { background: rgba(148, 163, 184, 0.12); color: var(--text-dim); border: 1px solid rgba(148, 163, 184, 0.2); }

        /* TradingView Widget Overrides */
        .tv-widget-container iframe {
            border: none !important;
            border-radius: 8px !important;
        }

        /* Tooltip Logic */
        [data-title] { position: relative; }
        [data-title]:hover::after {
            content: attr(data-title);
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 8px;
            background: #1e293b;
            color: white;
            font-size: 10px;
            border-radius: 4px;
            white-space: nowrap;
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        @media (max-width: 1200px) {
            .workspace-grid { grid-template-columns: 240px 1fr 0px; }
            .analysis-bar { display: none; }
        }
    </style>
</head>
<body>
    <div id="nexus-root"></div>

    <script type="text/babel">
        /**
         * NEXUS TERMINAL - PRODUCTION GRADE SOURCE
         * Architected for High-Performance Asset Tracking
         */

        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // --- GLOBAL CONSTANTS & DATA REGISTRY ---

        const THEME = {
            colors: {
                bg: '#0a0e14',
                bgDeep: '#060811',
                panel: 'rgba(18,22,31,0.72)',
                cyan: '#22d3ee',
                violet: '#7c6ff0',
                green: '#16c784',
                red: '#ea3943',
                grid: 'rgba(255,255,255,0.04)',
                crosshair: 'rgba(255,255,255,0.25)'
            }
        };

        const ASSET_REGISTRY = {
            CRYPTO: [
                // Large Caps
                'BTC','ETH','BNB','SOL','XRP','ADA','DOGE','AVAX','DOT','LINK',
                'MATIC','LTC','TRX','SHIB','ATOM','UNI','ETC','XLM','NEAR','APT',
                // Mid Caps
                'OP','ARB','FIL','MANA','SAND','GALA','INJ','SUI','SEI','PEPE',
                'FLOKI','BONK','WIF','JTO','RNDR','FET','AGIX','OCEAN','GRT','LRC',
                'IMX','BLUR','ENS','CRV','CVX','BAL','AAVE','COMP','MKR','SNX',
                // Newer
                'TON','HBAR','ALGO','VET','EGLD','FTM','THETA','KLAY','ZIL','ONE',
                'ROSE','CELR','SKL','ANKR','DENT','HOT','SC','XEM','DGB','ZEC',
                'DASH','XMR','EOS','ICX','ONT','ZRX','BAT','STORJ','AUDIO','BAND',
                'ICP','STX','FLOW','CELO','CHZ','ENJ','AXS','GMT','LUNC','USTC',
            ],
            STOCKS: {
                'US Tech': ['AAPL','MSFT','GOOGL','AMZN','NVDA','META','TSLA','NFLX','AMD','INTC','ORCL','CRM','ADBE','QCOM','AVGO','IBM','CSCO','TXN','MU','AMAT','NOW','SNOW','PANW','CRWD','ZS'],
                'US Finance': ['JPM','BAC','GS','MS','WFC','C','BRK-B','V','MA','AXP','BLK','SCHW','COF','USB','PNC','TFC','ALLY','SQ','PYPL','COIN'],
                'US Health': ['JNJ','PFE','UNH','ABBV','MRK','LLY','BMY','AMGN','GILD','REGN','VRTX','MRNA','ISRG','DHR','MDT','ELV','CI','CVS','HUM','ZBH'],
                'US Consumer': ['AMZN','WMT','HD','MCD','SBUX','NKE','DIS','KO','PEP','PM','MO','CL','PG','KHC','GIS','K','CPB','CAG','SYY','HSY'],
                'US Energy': ['XOM','CVX','COP','SLB','EOG','PXD','MPC','PSX','VLO','OXY','HAL','BKR','DVN','FANG','APA'],
                'India NSE': ['RELIANCE.NS','TCS.NS','INFY.NS','HDFCBANK.NS','ICICIBANK.NS','HINDUNILVR.NS','BAJFINANCE.NS','SBIN.NS','BHARTIARTL.NS','ITC.NS','WIPRO.NS','AXISBANK.NS','KOTAKBANK.NS','TECHM.NS','LT.NS','MARUTI.NS','ULTRACEMCO.NS','TITAN.NS','NESTLEIND.NS','POWERGRID.NS','HCLTECH.NS','SUNPHARMA.NS','ONGC.NS','NTPC.NS','TATAMOTORS.NS','TATASTEEL.NS','JSWSTEEL.NS','COALINDIA.NS','INDUSINDBK.NS','DRREDDY.NS'],
                'UK': ['HSBA.L','LLOY.L','BP.L','SHEL.L','GSK.L','AZN.L','ULVR.L','RIO.L','BT-A.L','BARC.L','STAN.L','NWG.L','VOD.L','BATS.L','DGE.L'],
                'Germany': ['SAP.DE','SIE.DE','BMW.DE','MBG.DE','VOW3.DE','ALV.DE','BAYN.DE','DBK.DE','DTE.DE','RWE.DE','BAS.DE','MUV2.DE'],
                'Japan': ['7203.T','6758.T','9984.T','8306.T','6501.T','6752.T','7267.T','4063.T','6902.T','8035.T'],
                'China': ['BABA','JD','PDD','NIO','BIDU','TCEHY','XPEV','LI','YUMC','NTES','VIPS','IQ','TIGR'],
                'ETFs': ['SPY','QQQ','DIA','IWM','GLD','SLV','USO','VTI','ARKK','XLF','XLK','XLV','XLE','XLP','EEM','EFA','VWO','AGG','TLT','HYG'],
                'Watchlist': [],
            }
        };

        // ─── FREE STOCK & MARKET DATA APIs ───────────────────────────────────
        // 1. Yahoo Finance v8/v10 (via CORS proxy) — OHLCV + fundamentals
        // 2. Yahoo Finance RSS  — news headlines
        // 3. CoinGecko (free, no key) — crypto fundamentals & global market
        // 4. Binance public REST+WS — crypto OHLCV + live prices
        // 5. Alternative.me — Fear & Greed index
        // 6. CryptoPanic (free token) — crypto news
        // 7. Stooq.com (no key) — backup OHLCV for Indian & global stocks
        // 8. Open Exchange Rates (free tier) — forex
        // 9. FMP (Financial Modeling Prep) — free tier stocks & ETFs

        const PROXIES = {
            allorigins: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            corsproxy: (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            thingproxy: (url) => `https://thingproxy.freeboard.io/fetch/${url}`,
        };

        // Multi-proxy fallback for Yahoo Finance
        const yahooFetch = async (path) => {
            const base = `https://query1.finance.yahoo.com${path}`;
            const base2 = `https://query2.finance.yahoo.com${path}`;
            const proxies = [
                PROXIES.allorigins(base),
                PROXIES.allorigins(base2),
                PROXIES.corsproxy(base),
            ];
            for (const url of proxies) {
                try {
                    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
                    if (r.ok) return await r.json();
                } catch (e) { continue; }
            }
            throw new Error('All Yahoo Finance proxies failed');
        };

        // Yahoo Finance Chart API — returns clean OHLCV array
        const yahooChart = async (symbol, interval = '1d', range = '6mo') => {
            // Map our timeframes to Yahoo intervals/ranges
            const intervalMap = {
                '1m': { iv: '1m', rng: '1d' },
                '5m': { iv: '5m', rng: '5d' },
                '15m': { iv: '15m', rng: '5d' },
                '1h': { iv: '60m', rng: '1mo' },
                '4h': { iv: '1h', rng: '3mo' },   // Yahoo has no 4h; use 1h + 3mo
                '1D': { iv: '1d', rng: '1y' },
                '1W': { iv: '1wk', rng: '5y' },
            };
            const { iv, rng } = intervalMap[interval] || { iv: interval, rng: range };
            const path = `/v8/finance/chart/${encodeURIComponent(symbol)}?interval=${iv}&range=${rng}&includePrePost=false`;
            const json = await yahooFetch(path);
            const res = json?.chart?.result?.[0];
            if (!res) throw new Error('No chart data');
            const ts = res.timestamp;
            const q = res.indicators.quote[0];
            return ts.map((t, i) => ({
                time: t,
                open: q.open[i],
                high: q.high[i],
                low: q.low[i],
                close: q.close[i],
                volume: q.volume[i] || 0,
            })).filter(d => d.open != null && d.close != null && !isNaN(d.close));
        };

        // Yahoo Finance Quote Summary — fundamentals
        const yahooFundamentals = async (symbol) => {
            const modules = 'price,financialData,summaryDetail,defaultKeyStatistics,assetProfile,earnings';
            const path = `/v10/finance/quoteSummary/${encodeURIComponent(symbol)}?modules=${modules}`;
            const json = await yahooFetch(path);
            const r = json?.quoteSummary?.result?.[0];
            if (!r) throw new Error('No fundamental data');
            const pr = r.price || {};
            const fd = r.financialData || {};
            const sd = r.summaryDetail || {};
            const ks = r.defaultKeyStatistics || {};
            const ap = r.assetProfile || {};
            return {
                name: pr.longName || pr.shortName || symbol,
                symbol: pr.symbol || symbol,
                exchange: pr.exchangeName,
                currency: pr.currency || 'USD',
                price: pr.regularMarketPrice?.raw,
                change: pr.regularMarketChange?.raw,
                changePct: pr.regularMarketChangePercent?.raw,
                marketCap: pr.marketCap?.raw,
                pe: sd.trailingPE?.raw,
                forwardPE: sd.forwardPE?.raw,
                eps: ks.trailingEps?.raw,
                revenue: fd.totalRevenue?.raw,
                grossMargin: fd.grossMargins?.raw,
                profitMargin: fd.profitMargins?.raw,
                revenueGrowth: fd.revenueGrowth?.raw,
                earningsGrowth: fd.earningsGrowth?.raw,
                debtToEquity: fd.debtToEquity?.raw,
                currentRatio: fd.currentRatio?.raw,
                roe: fd.returnOnEquity?.raw,
                roa: fd.returnOnAssets?.raw,
                freeCashFlow: fd.freeCashflow?.raw,
                operatingCashFlow: fd.operatingCashflow?.raw,
                dividendYield: sd.dividendYield?.raw,
                dividendRate: sd.dividendRate?.raw,
                beta: sd.beta?.raw,
                high52w: sd.fiftyTwoWeekHigh?.raw,
                low52w: sd.fiftyTwoWeekLow?.raw,
                avg50: sd.fiftyDayAverage?.raw,
                avg200: sd.twoHundredDayAverage?.raw,
                avgVolume: sd.averageVolume?.raw,
                avgVolume10d: sd.averageVolume10days?.raw,
                sharesOutstanding: ks.sharesOutstanding?.raw,
                floatShares: ks.floatShares?.raw,
                shortRatio: ks.shortRatio?.raw,
                bookValue: ks.bookValue?.raw,
                priceToBook: ks.priceToBook?.raw,
                sector: ap.sector,
                industry: ap.industry,
                employees: ap.fullTimeEmployees,
                country: ap.country,
                website: ap.website,
                description: ap.longBusinessSummary?.slice(0, 500),
                // Analyst data
                targetMean: fd.targetMeanPrice?.raw,
                targetHigh: fd.targetHighPrice?.raw,
                targetLow: fd.targetLowPrice?.raw,
                recommendation: fd.recommendationKey,
                numAnalysts: fd.numberOfAnalystOpinions?.raw,
            };
        };

        // Yahoo Finance RSS news
        const yahooNews = async (symbol) => {
            const url = `https://feeds.finance.yahoo.com/rss/2.0/headline?s=${symbol}&lang=en-US`;
            const proxies = [PROXIES.allorigins(url), PROXIES.corsproxy(url)];
            for (const purl of proxies) {
                try {
                    const r = await fetch(purl);
                    const txt = await r.text();
                    const doc = new DOMParser().parseFromString(txt, 'text/xml');
                    const items = Array.from(doc.querySelectorAll('item')).slice(0, 15);
                    return items.map(i => {
                        const title = i.querySelector('title')?.textContent || '';
                        const link = i.querySelector('link')?.textContent || '#';
                        const pubDate = i.querySelector('pubDate')?.textContent || '';
                        const desc = i.querySelector('description')?.textContent || '';
                        const bullish = ['surge', 'rally', 'beat', 'breakout', 'upgrade', 'buy', 'growth', 'record', 'profit', 'gain', 'rise', 'up', 'bull'];
                        const bearish = ['crash', 'dump', 'miss', 'downgrade', 'sell', 'warning', 'loss', 'decline', 'fall', 'down', 'cut', 'fear', 'bear'];
                        const tl = title.toLowerCase();
                        const sentiment = bullish.filter(k => tl.includes(k)).length > bearish.filter(k => tl.includes(k)).length ? 'Bullish' : bearish.some(k => tl.includes(k)) ? 'Bearish' : 'Neutral';
                        return { title, link, pubDate, desc, sentiment, source: 'Yahoo Finance' };
                    });
                } catch (e) { continue; }
            }
            return [];
        };

        // Stooq.com — free backup for OHLCV (no CORS issues via proxy)
        const stooqChart = async (symbol, interval = '1d') => {
            const ivMap = { '1D': 'd', '1W': 'w', '1h': 'h', '4h': 'h' };
            const iv = ivMap[interval] || 'd';
            const sym = symbol.replace('.NS', '.IN').replace('.BO', '.IN').toLowerCase();
            const url = `https://stooq.com/q/d/l/?s=${sym}&i=${iv}`;
            try {
                const r = await fetch(PROXIES.allorigins(url));
                const txt = await r.text();
                const lines = txt.trim().split('\n').slice(1); // skip header
                return lines.map(ln => {
                    const [date, open, high, low, close, volume] = ln.split(',');
                    const t = new Date(date).getTime() / 1000;
                    return { time: t, open: +open, high: +high, low: +low, close: +close, volume: +(volume||0) };
                }).filter(d => !isNaN(d.time) && !isNaN(d.close));
            } catch (e) { return []; }
        };

        // CoinGecko — crypto fundamentals (free, no key, rate limited)
        const cgFetch = async (path) => {
            const url = `https://api.coingecko.com/api/v3${path}`;
            const r = await fetch(url);
            if (!r.ok) throw new Error(`CoinGecko ${r.status}`);
            return r.json();
        };

        const CG_ID_MAP = {
            BTC:'bitcoin',ETH:'ethereum',BNB:'binancecoin',SOL:'solana',XRP:'ripple',
            ADA:'cardano',DOGE:'dogecoin',AVAX:'avalanche-2',DOT:'polkadot',LINK:'chainlink',
            MATIC:'matic-network',LTC:'litecoin',TRX:'tron',SHIB:'shiba-inu',ATOM:'cosmos',
            UNI:'uniswap',ETC:'ethereum-classic',XLM:'stellar',NEAR:'near',APT:'aptos',
            OP:'optimism',ARB:'arbitrum',FIL:'filecoin',MANA:'decentraland',SAND:'the-sandbox',
            INJ:'injective-protocol',SUI:'sui',PEPE:'pepe',RNDR:'render-token',FET:'fetch-ai',
            AAVE:'aave',COMP:'compound-governance-token',MKR:'maker',SNX:'havven',
            CRV:'curve-dao-token',BAL:'balancer',GRT:'the-graph',ENS:'ethereum-name-service',
            IMX:'immutable-x',BLUR:'blur',LRC:'loopring',OCEAN:'ocean-protocol',
        };

        const cgCoinData = async (base) => {
            const id = CG_ID_MAP[base] || base.toLowerCase();
            return cgFetch(`/coins/${id}?localization=false&tickers=false&market_data=true&community_data=true&sparkline=false`);
        };

        const cgGlobal = async () => cgFetch('/global');
        const cgTrending = async () => cgFetch('/search/trending');

        // Alternative.me — Fear & Greed index (free, no key)
        const fearGreed = async () => {
            const r = await fetch('https://api.alternative.me/fng/?limit=1');
            const j = await r.json();
            return j.data[0];
        };

        // CryptoPanic — crypto news (free token)
        const cpNews = async (base) => {
            const token = 'b2ac1cc7dc79988a71d7de0bdb7e5d4ab9c6c2e5';
            const r = await fetch(`https://cryptopanic.com/api/v1/posts/?auth_token=${token}&currencies=${base}&kind=news&public=true`);
            if (!r.ok) throw new Error('CryptoPanic error');
            return r.json();
        };

        // Smart chart data fetcher — tries best source, falls back gracefully
        const fetchChartData = async (symbol, type, interval) => {
            if (type === 'CRYPTO') {
                const binanceInterval = interval.toLowerCase().replace('1d', '1d').replace('1w', '1w').replace('4h', '4h');
                const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${binanceInterval}&limit=1000`);
                const raw = await r.json();
                return raw.map(d => ({
                    time: d[0] / 1000, open: +d[1], high: +d[2], low: +d[3], close: +d[4], volume: +d[5]
                }));
            } else {
                // Try Yahoo Finance first, then Stooq as backup
                try { return await yahooChart(symbol, interval); }
                catch (e) {
                    console.warn('Yahoo failed, trying Stooq:', e.message);
                    const stooq = await stooqChart(symbol, interval);
                    if (stooq.length > 0) return stooq;
                    throw new Error('All chart sources failed');
                }
            }
        };

        // Smart stock price fetcher for sidebar list
        const fetchStockBatch = async (symbols) => {
            const results = {};
            // Yahoo Finance batch quote
            const joined = symbols.join(',');
            try {
                const path = `/v7/finance/quote?symbols=${encodeURIComponent(joined)}&fields=symbol,regularMarketPrice,regularMarketChangePercent,regularMarketChange,regularMarketVolume`;
                const j = await yahooFetch(path);
                const quotes = j?.quoteResponse?.result || [];
                quotes.forEach(q => {
                    results[q.symbol] = {
                        p: q.regularMarketPrice?.toFixed(2),
                        c: q.regularMarketChangePercent?.toFixed(2),
                        chg: q.regularMarketChange?.toFixed(2),
                        v: q.regularMarketVolume,
                    };
                });
            } catch (e) { console.warn('Stock batch fetch failed:', e); }
            return results;
        };
        

        // --- CORE UTILITY ENGINE ---

        const Engine = {
            formatCurrency: (val, symbol = '$', decimals = 2) => {
                if (!val) return '--';
                const n = parseFloat(val);
                if (n === 0) return symbol + '0.00';
                const d = n < 1 ? 6 : n < 100 ? 4 : decimals;
                return symbol + n.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
            },
            formatCompact: (n) => {
                if (!n) return '--';
                const abs = Math.abs(n);
                if (abs >= 1e12) return (n / 1e12).toFixed(2) + 'T';
                if (abs >= 1e9) return (n / 1e9).toFixed(2) + 'B';
                if (abs >= 1e6) return (n / 1e6).toFixed(2) + 'M';
                if (abs >= 1e3) return (n / 1e3).toFixed(2) + 'K';
                return n.toFixed(2);
            },
            timeAgo: (date) => {
                const seconds = Math.floor((new Date() - new Date(date)) / 1000);
                if (seconds < 60) return seconds + 's';
                if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
                if (seconds < 86400) return Math.floor(seconds / 3600) + 'h';
                return Math.floor(seconds / 86400) + 'd';
            }
        };

        const Indicators = {
            sma: (data, p) => {
                const res = [];
                for(let i=0; i<data.length; i++) {
                    if(i < p-1) res.push(null);
                    else res.push(data.slice(i-p+1, i+1).reduce((a,b)=>a+b,0)/p);
                }
                return res;
            },
            ema: (data, p) => {
                const k = 2/(p+1);
                let ema = data[0];
                const res = [ema];
                for(let i=1; i<data.length; i++) {
                    ema = data[i]*k + ema*(1-k);
                    res.push(ema);
                }
                return res;
            },
            rsi: (data, p=14) => {
                let g=0, l=0;
                for(let i=1; i<=p; i++) {
                    const d = data[i]-data[i-1];
                    if(d>=0) g+=d; else l-=d;
                }
                let ag = g/p, al = l/p;
                const res = new Array(p).fill(null);
                res.push(100 - (100/(1+ag/al)));
                for(let i=p+1; i<data.length; i++) {
                    const d = data[i]-data[i-1];
                    ag = (ag*(p-1)+(d>0?d:0))/p;
                    al = (al*(p-1)+(d<0?-d:0))/p;
                    res.push(100 - (100/(1+ag/al)));
                }
                return res;
            },
            macd: (data, slow=26, fast=12, sig=9) => {
                const eFast = Indicators.ema(data, fast);
                const eSlow = Indicators.ema(data, slow);
                const line = eFast.map((f,i) => f - eSlow[i]);
                const signal = Indicators.ema(line.slice(slow), sig);
                const hist = signal.map((s,i) => line[i+slow] - s);
                return { line, signal, hist };
            },
            bollinger: (data, p=20, sd=2) => {
                const res = [];
                for(let i=0; i<data.length; i++) {
                    if(i<p-1) res.push(null);
                    else {
                        const slice = data.slice(i-p+1, i+1);
                        const mean = slice.reduce((a,b)=>a+b,0)/p;
                        const sdev = Math.sqrt(slice.reduce((a,b)=>a+Math.pow(b-mean,2),0)/p);
                        res.push({ mid: mean, upper: mean+sd*sdev, lower: mean-sd*sdev });
                    }
                }
                return res;
            },
            atr: (ohlcv, p=14) => {
                const trs = [ohlcv[0].high - ohlcv[0].low];
                for(let i=1; i<ohlcv.length; i++) {
                    trs.push(Math.max(ohlcv[i].high-ohlcv[i].low, Math.abs(ohlcv[i].high-ohlcv[i-1].close), Math.abs(ohlcv[i].low-ohlcv[i-1].close)));
                }
                let atr = trs.slice(0, p).reduce((a,b)=>a+b,0)/p;
                const res = new Array(p-1).fill(null);
                res.push(atr);
                for(let i=p; i<trs.length; i++) {
                    atr = (atr*(p-1)+trs[i])/p;
                    res.push(atr);
                }
                return res;
            }
        };

                const res = [];
                const c = ohlcv[ohlcv.length - 1];

                            <TechLine label="BB Upper" val={Engine.formatCurrency(bb.upper, '', 2)} up={last < bb.upper} />

                                <div className="mt-3 h-2 bg-white/5 rounded-full overflow-hidden">
                                    <div className="h-full rounded-full transition-all" style={{width: fg.value + '%', background: fgColor}}/>
                                </div>
                                <div className="flex justify-between text-[9px] text-slate-600 mt-1">
                                    <span>Extreme Fear</span><span>Extreme Greed</span>
                                </div>
                            </div>
                        )}
                        {global && (
                            <div className="p-5 bg-white/5 rounded-3xl border border-white/10 space-y-3">
                                <div className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Global Crypto Market</div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div><div className="text-[10px] text-slate-600">Market Cap</div><div className="text-sm font-bold font-mono text-cyan-400">${Engine.formatCompact(global.total_market_cap?.usd)}</div></div>
                                    <div><div className="text-[10px] text-slate-600">24h Volume</div><div className="text-sm font-bold font-mono">${Engine.formatCompact(global.total_volume?.usd)}</div></div>
                                    <div><div className="text-[10px] text-slate-600">BTC Dominance</div><div className="text-sm font-bold font-mono text-yellow-400">{global.market_cap_percentage?.btc?.toFixed(1)}%</div></div>
                                    <div><div className="text-[10px] text-slate-600">Active Coins</div><div className="text-sm font-bold font-mono">{global.active_cryptocurrencies?.toLocaleString()}</div></div>
                                </div>
                                <div>
                                    <div className="text-[9px] text-slate-600 mb-1">Market Cap Change 24h</div>
                                    <span className={`text-sm font-bold ${global.market_cap_change_percentage_24h_usd >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                        {global.market_cap_change_percentage_24h_usd?.toFixed(2)}%
                                    </span>
                                </div>
                            </div>
                        )}
                        <div className="p-5 bg-white/5 rounded-3xl border border-white/10">
                            <div className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Top Gainers (24h)</div>
                            <div className="space-y-2">
                                {gainers.map(g => (
                                    <div key={g.sym} className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-slate-400">{g.sym.replace('USDT','')}</span>
                                        <span className="text-xs font-bold font-mono text-green-400">+{g.c.toFixed(2)}%</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="p-5 bg-white/5 rounded-3xl border border-white/10">
                            <div className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Top Losers (24h)</div>
                            <div className="space-y-2">
                                {losers.map(g => (
                                    <div key={g.sym} className="flex justify-between items-center">
                                        <span className="text-xs font-bold text-slate-400">{g.sym.replace('USDT','')}</span>
                                        <span className="text-xs font-bold font-mono text-red-400">{g.c.toFixed(2)}%</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        {trending.length > 0 && (
                            <div className="p-5 bg-white/5 rounded-3xl border border-white/10">
                                <div className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Trending on CoinGecko</div>
                                <div className="flex flex-wrap gap-2">
                                    {trending.map((t, i) => (
                                        <span key={i} className="text-[11px] px-3 py-1 bg-violet-500/10 border border-violet-500/20 rounded-full text-violet-400 font-bold">
                                            #{i+1} {t.item?.symbol}
                                        </span>
                                    ))}
                                </div>
                            </div>
                        )}
                    </>)}
                </div>
            );
        };

        const TVWidget = ({ symbol }) => {
            const sym = symbol.includes('USDT') ? `BINANCE:${symbol}` : symbol.replace('.NS', '').replace('.BO', '');
            return (
                <div className="h-full min-h-[550px] w-full bg-black/40 rounded-3xl overflow-hidden border border-white/10 tv-widget-container">
                    <iframe 
                        src={`https://www.tradingview.com/widgetbar-chart/?symbol=${sym}&theme=dark`}
                        className="w-full h-full"
                    />
                </div>
            );
        };

        // --- ROOT ORCHESTRATOR ---

        const App = () => {
            const [activeS, setActiveS] = useState('BTCUSDT');
            const [activeA, setActiveA] = useState({ symbol: 'BTCUSDT', type: 'CRYPTO', name: 'Bitcoin' });
            const [prices, setPrices] = useState({});
            const [watchlist, setWatchlist] = useState(JSON.parse(localStorage.getItem('nexus_wl_v2') || '[]'));
            const [ohlcv, setOhlcv] = useState([]);
            const [timeframe, setTimeframe] = useState('1h');
            const [clock, setClock] = useState('');

            useEffect(() => {
                const t = setInterval(() => {
                    setClock(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }));
                }, 1000);
                return () => clearInterval(t);
            }, []);

            useEffect(() => {
                const ws = new WebSocket('wss://stream.binance.com:9443/ws/!miniTicker@arr');
                ws.onmessage = (e) => {
                    const data = JSON.parse(e.data);
                    const ups = {};
                    data.forEach(d => {
                        if (d.s.endsWith('USDT')) {
                            ups[d.s] = {
                                p: d.c,
                                c: ((parseFloat(d.c) - parseFloat(d.o)) / parseFloat(d.o) * 100).toFixed(2),
                                h: d.h, l: d.l, v: d.q
                            };
                        }
                    });
                    setPrices(prev => ({ ...prev, ...ups }));
                };
                return () => ws.close();
            }, []);

            const onSelect = (s, type, name) => {
                setActiveS(s);
                setActiveA({ symbol: s, type, name });
            };

            const toggleWL = (s) => {
                const next = watchlist.includes(s) ? watchlist.filter(x => x !== s) : [...watchlist, s];
                setWatchlist(next);
                localStorage.setItem('nexus_wl_v2', JSON.stringify(next));
            };

            useEffect(() => {
                const k = (e) => {
                    if (e.key === '/') { e.preventDefault(); document.querySelector('input')?.focus(); }
                };
                window.addEventListener('keydown', k);
                return () => window.removeEventListener('keydown', k);
            }, []);

            return (
                <div className="terminal-shell">
                    <Header symbol={activeS} asset={activeA} prices={prices} clock={clock} />
                    <main className="workspace-grid">
                        <Sidebar onSelect={onSelect} activeSymbol={activeS} prices={prices} watchlist={watchlist} onToggleWL={toggleWL} />
                        <MainChart symbol={activeS} type={activeA.type} timeframe={timeframe} setTimeframe={setTimeframe} onData={setOhlcv} />
                        <div className="analysis-bar">
                            <AnalysisPanel symbol={activeS} type={activeA.type} ohlcv={ohlcv} prices={prices} />
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('nexus-root'));
        root.render(<App />);
    </script>
</body>
</html>
